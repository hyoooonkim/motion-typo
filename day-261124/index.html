<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Day 261124 — 우연 돌림판 포스터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root { --bg: #1d1c21; --ink: #f1ede4; --mute: #8f8a80; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Mono', 'Noto Sans KR', monospace; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #wheel { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 3; }
  #top { position: fixed; left: 18px; right: 18px; top: 14px; mix-blend-mode: difference; color: #fff; display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; z-index: 5; pointer-events: none; }
  #top a { color: inherit; text-decoration: none; pointer-events: auto; }
  #poster { position: fixed; z-index: 1; display: block; box-shadow: 0 2px 0 rgba(0,0,0,.25), 0 30px 60px -20px rgba(0,0,0,.7); pointer-events: none; }
  #meta { position: fixed; z-index: 4; left: 18px; top: 46px; width: 250px; font-size: 11.5px; line-height: 1.75; color: var(--ink); }
  #meta .k { color: var(--mute); }
  #ctl { position: fixed; z-index: 4; left: 18px; bottom: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  #ctl .row { display: flex; gap: 6px; }
  #spin { white-space: nowrap; background: #f4f2ed; color: #1d1c21; border: 0; padding: 13px 26px; font-size: 14px; font-weight: 600; letter-spacing: .08em; }
  #spin:disabled { opacity: .45; cursor: default; }
  #save { background: #1d1c21; border: 1px solid rgba(241,237,228,.3); padding: 12px 16px; font-size: 12px; }
  #hint { font-size: 11px; color: var(--mute); font-family: 'Noto Sans KR', sans-serif; }
  #wall { position: fixed; z-index: 4; left: 18px; top: 260px; display: grid; grid-template-columns: repeat(4, 54px); gap: 6px; }
  #wall canvas { width: 54px; height: 72px; display: block; cursor: pointer; box-shadow: 0 4px 10px -6px rgba(0,0,0,.6); }
  #wall canvas.on { outline: 1.5px solid #f4f2ed; outline-offset: 2px; }
  @media (max-width: 760px) {
    #meta { display: none; } #wall { display: none; }
    #ctl { left: auto; right: 10px; bottom: 10px; align-items: flex-end; } #spin { padding: 11px 18px; font-size: 13px; } #hint { display: none; }
  }
</style>
</head>
<body>
<header id="top"><span>우연 · WHEEL POSTER</span><a href="../index.html">← INDEX</a></header>
<canvas id="wheel"></canvas>
<canvas id="poster" width="900" height="1200"></canvas>
<div id="meta"></div>
<div id="wall"></div>
<div id="ctl"><span id="hint">돌림판을 끌어서 돌리거나 버튼을 눌러요</span><div class="row"><button id="save">저장</button><button id="spin">돌리기</button></div></div>
<script type="module" src="main.js?v=19"></script>
</body>
</html>
