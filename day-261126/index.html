<title>Day 261126 — 보통 사람들의 주화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
  html, body { margin: 0; min-height: 100%; background: #121110; color: #d9d2c3; font-family: 'IBM Plex Mono', monospace; }
  body { background: radial-gradient(ellipse at 50% 30%, #1d1b19 0%, #0d0c0b 75%) fixed; }
  #top { position: fixed; left: 18px; right: 18px; top: 14px; display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; z-index: 3; pointer-events: none; }
  #top a { color: inherit; text-decoration: none; pointer-events: auto; }
  html, body { overflow-x: hidden; }
  main { position: relative; width: 100%; }
  .coin { position: absolute; perspective: 900px; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
  .shadow { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .7; filter: blur(3px); pointer-events: none; }
  .rot { position: absolute; inset: 0; transform-style: preserve-3d; }
  .toss { position: absolute; inset: 0; transform-style: preserve-3d; }
  .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .25s ease-out; transform: rotateX(calc(var(--rx, 0deg) + var(--flip, 0deg))) rotateY(var(--ry, 0deg)); }
  .inner canvas { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .inner canvas.back { transform: rotateX(180deg); }
  .coin.flip .inner { --flip: 180deg; }
</style>
</head>
