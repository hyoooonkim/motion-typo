  #home.on { opacity: 1; }

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const cv = document.getElementById('cv'); let ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const INK = '58,42,26', HOME = [127, 37.5], DEG = 180 / Math.PI;
let W = 0, H = 0, DPR = 1, BASE = 300, z = 1, rot = [-HOME[0], -HOME[1]], spin = [0, 0];
let drag = null, homing = false, moved = false, idle = 0, last = performance.now();

function hash(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// 알려진 정도: 서울에서 45°까지는 또렷하고(0), 지구 반대편으로 갈수록 모른다(.92)
const unc = (lon, lat) => { const t = clamp((d3.geoDistance([lon, lat], HOME) * DEG - 45) / 100); return t * t * (3 - 2 * t) * .92; };
// 모르는 곳일수록 위치가 어긋나게 베껴 그린 선
const jit = (lon, lat, u) => { const k = u * u * 2.4; return [lon + (vnoise(lon * .6, lat * .6, 7) - .5) * 2 * k, lat + (vnoise(lon * .6, lat * .6, 8) - .5) * 2 * k]; };

const proj = d3.geoOrthographic().clipAngle(90).precision(0);
const path = d3.geoPath(proj, ctx);
const GRAT = d3.geoGraticule10();
let COAST = [], COAST_FINE = [], RIVER = [], LABELS = [], UNKNOWN = [], PHRASE = [];

// 선을 짧은 조각으로 나누고, 알려진 정도별로 10묶음으로 모아 둔다
function bucketLines(lines, step, drop) {
  const B = Array.from({ length: 10 }, () => []);
  for (const ln of lines) for (let i = 0; i < ln.length - 1; i += step) {
    const seg = ln.slice(i, i + step + 1), [lon, lat] = seg[0], u = unc(lon, lat);
    if (drop && hash(lon * 100 | 0, lat * 100 | 0, 5) < (u - .45) * 1.5) continue;
    B[Math.min(9, u * 10 | 0)].push(seg.map(([a, b]) => jit(a, b, unc(a, b))));
  }
  return B.map((c, i) => ({ u: (i + .5) / 10, geo: { type: 'MultiLineString', coordinates: c } }));
}

async function loadWorld() {
  const [topo, small, places] = await Promise.all([
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-50m.json').then(r => r.json()),
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(r => r.json()),
    fetch('places.json').then(r => r.json()),
  ]);
  // 멀리서는 가벼운 1:1억1천만, 확대하면 정밀한 1:5천만 해안선
  const ringsOf = t => { const out = []; for (const f of topojson.feature(t, t.objects.land).features) { const g = f.geometry; (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).forEach(p => p.forEach(r => out.push(r.filter(([, lat]) => lat > -84)))); } return out; };
  COAST = bucketLines(ringsOf(small), 4, true);
  COAST_FINE = bucketLines(ringsOf(topo), 10, true);
  RIVER = bucketLines(places.rivers.map(seg => seg.map(([lat, lon]) => [lon, lat])), 8, true);
  LABELS = places.labels.map(([n, lat, lon, k, sz, side]) => {
    const u = unc(lon, lat), hk = n.length * 7 + (lon * 10 | 0);
    const txt = [...n].map((ch, i) => ch !== ' ' && hash(hk, i, 30) < u * 1.2 ? '?' : ch).join('');
    return { txt, p: jit(lon, lat, u), k, sz, side, u };
  }).filter(l => l.u < .82);
  for (let lat = -78; lat <= 80; lat += 7) for (let lon = -180; lon < 180; lon += 7 / Math.max(.25, Math.cos(lat / DEG))) {
    const u = unc(lon, lat);
    if (u > .78 && hash(lon * 10 | 0, lat * 10 | 0, 71) < .3) UNKNOWN.push({ p: [lon + hash(lon | 0, lat | 0, 72) * 4, lat + hash(lon | 0, lat | 0, 73) * 4], u, s: hash(lon | 0, lat | 0, 74) });
  }
  PHRASE = d3.geoCircle().center(HOME).radius(118).precision(36)().coordinates[0].slice(0, -1);
}


let PAPER = null;
{ const im = new Image(); im.onload = () => { PAPER = ctx.createPattern(im, 'repeat'); delete LAYERS.base; }; im.src = 'paper.webp'; }

function spaced(text, x, y, sp) {
  const ch = [...text], ws = ch.map(c => ctx.measureText(c).width), tot = ws.reduce((a, b) => a + b, 0) + sp * (ch.length - 1);
  let cx = x - tot / 2;
  ch.forEach((c, i) => { ctx.fillText(c, cx + ws[i] / 2, y); cx += ws[i] + sp; });
  return tot;
}
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; BASE = Math.min(W, H) * .36;
}

// 반지름이 정해지면 변하지 않는 그림은 판 하나에 미리 그려 둔다(반지름 4% 단위로 다시 그림)
const LAYERS = {};
function layer(name, R, pad, paint) {
  const q = Math.round(Math.log(R) / Math.log(1.04)), Rq = Math.pow(1.04, q), size = Math.ceil((Rq + pad * Rq) * 2 * DPR);
  if (size > 4600) return null;
  let L = LAYERS[name];
  if (!L || L.q !== q || L.dpr !== DPR) {
    const c = L?.c || document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, size, size);
    const o = Rq * (1 + pad); paint(g, Rq, o, o);
    L = LAYERS[name] = { c, q, dpr: DPR, Rq, half: o };
  }
  return L;
}
function put(L, R, cx, cy) { const k = R / L.Rq, h = L.half * k; ctx.drawImage(L.c, cx - h, cy - h, h * 2, h * 2); }
function paintBase(g, R, cx, cy, direct) {
  const g0 = g.createRadialGradient(cx - R * .35, cy - R * .4, R * .05, cx, cy, R * 1.02);
  g0.addColorStop(0, '#f6ead0'); g0.addColorStop(.55, '#e2cfa6'); g0.addColorStop(1, '#a88a5a');
  g.save(); if (!direct) { g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = R * .12; } g.fillStyle = g0; g.beginPath(); g.arc(cx, cy, R, 0, 6.283); g.fill(); g.restore();
  if (PAPER) { g.save(); g.beginPath(); g.arc(cx, cy, R, 0, 6.283); g.clip(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = .55; g.fillStyle = PAPER; g.fillRect(0, 0, cx * 2, cy * 2); g.restore(); }
}
function paintShade(g, R, cx, cy) {
  const g1 = g.createRadialGradient(cx - R * .3, cy - R * .35, R * .2, cx, cy, R);
  g1.addColorStop(0, 'rgba(255,248,230,.18)'); g1.addColorStop(.6, 'rgba(90,60,25,0)'); g1.addColorStop(1, 'rgba(60,35,12,.55)');
  g.fillStyle = g1; g.beginPath(); g.arc(cx, cy, R, 0, 6.283); g.fill();
}
function paintRing(g, R, cx, cy) {
  const keep = ctx; ctx = g;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = 'rgba(214,184,120,.85)'; ctx.fillStyle = 'rgba(214,184,120,.85)';
  [[R + 6, 1.4], [R + 22, .8], [R + 34, .8], [R + 48, 1.6]].forEach(([r, w]) => { ctx.lineWidth = w; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.stroke(); });
  for (let k = 0; k < 72; k += 2) { ctx.beginPath(); ctx.arc(cx, cy, R + 22, k / 72 * 6.283, (k + 1) / 72 * 6.283); ctx.arc(cx, cy, R + 34, (k + 1) / 72 * 6.283, k / 72 * 6.283, true); ctx.fill(); }
  ctx = keep;
}

function drawGlobe(R, cx, cy, t) {
  const center = proj.invert([cx, cy]);
  const base = layer('base', R, .16, paintBase);
  if (base) put(base, R, cx, cy); else paintBase(ctx, R, cx, cy, true);
  ctx.save(); ctx.beginPath(); path({ type: 'Sphere' }); ctx.clip();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); path(GRAT); ctx.strokeStyle = `rgba(${INK},.17)`; ctx.lineWidth = .6; ctx.stroke();
  ctx.beginPath(); path({ type: 'LineString', coordinates: [[-180, 0], [-90, 0], [0, 0], [90, 0], [180, 0]] }); ctx.strokeStyle = `rgba(${INK},.35)`; ctx.lineWidth = 1; ctx.stroke();
  const lw = clamp(Math.sqrt(z), 1, 2.2);
  for (const { u, geo } of (z >= 1.8 && COAST_FINE.length ? COAST_FINE : COAST)) {
    if (!geo.coordinates.length) continue;
    ctx.beginPath(); path(geo);
    ctx.setLineDash(u > .5 ? [5 * lw, (3 + u * 8) * lw] : []);
    if (z < 3) { ctx.strokeStyle = `rgba(${INK},${.1 * (1 - u)})`; ctx.lineWidth = 7 * lw; ctx.stroke(); }
    ctx.strokeStyle = `rgba(${INK},${.92 * (1 - u * .8)})`; ctx.lineWidth = 1.25 * lw; ctx.stroke();
  }
  for (const { u, geo } of RIVER) {
    if (!geo.coordinates.length) continue;
    ctx.beginPath(); path(geo); ctx.setLineDash(u > .5 ? [3, 4 + u * 6] : []);
    ctx.strokeStyle = `rgba(${INK},${.5 * (1 - u)})`; ctx.lineWidth = .7 * lw; ctx.stroke();
  }
  ctx.setLineDash([]);

  // 지명: 앞면에 있는 것만, 가장자리로 갈수록 옅게, 겹치면 뒤 순위는 뺀다
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const boxes = [], fs = clamp(Math.pow(z, .45), 1, 2.4), hit = b => boxes.some(o => !(b[2] < o[0] || o[2] < b[0] || b[3] < o[1] || o[3] < b[1]));
  for (const L of LABELS) {
    const d = d3.geoDistance(L.p, center); if (d > 1.45) continue;
    const [x, y] = proj(L.p); if (x < -100 || y < -40 || x > W + 100 || y > H + 40) continue;
    const sz = L.sz * fs, sp = (L.k === 1 ? 6 : L.k === 0 ? 3 : 0) * fs;
    ctx.font = `${L.k === 0 ? 900 : 500} ${sz}px 'Noto Serif KR'`;
    if (!L.w) L.w = ctx.measureText(L.txt).width / sz;
    const w = L.w * sz + sp * [...L.txt].length, b = L.k === 2 ? (L.side < 0 ? [x - w - 8, y - sz * .7, x + 3, y + sz * .7] : [x - 3, y - sz * .7, x + w + 8, y + sz * .7]) : [x - w / 2, y - sz * .7, x + w / 2, y + sz * .7];
    if (hit(b)) continue; boxes.push(b);
    const a = clamp((1.45 - d) / .3) * (.18 + .8 * (1 - L.u));
    ctx.fillStyle = `rgba(${INK},${a})`;
    if (L.k === 2) {
      ctx.beginPath(); ctx.arc(x, y, 2.2 * fs, 0, 6.283); ctx.fill();
      ctx.textAlign = L.side < 0 ? 'right' : 'left'; ctx.fillText(L.txt, x + L.side * 6 * fs, y - 1); ctx.textAlign = 'center';
    } else {
      ctx.save(); ctx.translate(x, y); if (L.k) ctx.transform(1, 0, -.2, 1, 0, 0);
      if (L.k === 3) ctx.fillStyle = `rgba(${INK},${a * .7})`;
      spaced(L.txt, 0, 0, sp); ctx.restore();
    }
  }
  // 지구 반대편: 물음표와 '여기서부터는 용이 산다'
  for (const q of UNKNOWN) {
    const d = d3.geoDistance(q.p, center); if (d > 1.4) continue;
    const [x, y] = proj(q.p);
    ctx.font = `500 ${(12 + q.s * 16) * fs}px 'Noto Serif KR'`; ctx.fillStyle = `rgba(${INK},${clamp((1.4 - d) / .3) * (.2 + .25 * Math.sin(t * .8 + q.s * 40))})`;
    ctx.fillText('?', x, y);
  }
  ctx.font = `900 ${20 * fs}px 'Noto Serif KR'`;
  for (const p of PHRASE) {
    const d = d3.geoDistance(p, center); if (d > 1.3) continue;
    const [x, y] = proj(p); ctx.fillStyle = `rgba(${INK},${clamp((1.3 - d) / .3) * .8})`;
    spaced('여기서부터는 용이 산다', x, y, 4 * fs);
  }
  if (R < Math.hypot(W, H) * .8) { const shade = layer('shade', R, .02, paintShade); if (shade) put(shade, R, cx, cy); else paintShade(ctx, R, cx, cy); }
  ctx.restore();

  const diag = Math.hypot(W, H) / 2;
  if (R < diag) { const ring = layer('ring', R, .22, paintRing); if (ring) put(ring, R, cx, cy); else paintRing(ctx, R, cx, cy); }
}


function coordText(t) {
  const [lon, lat] = proj.invert([W / 2, H / 2]), u = unc(lon, lat);
  if (u > .86) return '여기는 지도 밖입니다';
  const dm = (v, a, b) => { const d = Math.abs(v), D = Math.floor(d), M = Math.floor((d - D) * 60); return `${v >= 0 ? a : b} ${D}° ${String(M).padStart(2, '0')}′`; };
  const raw = `${dm(lat, '북위', '남위')}   ${dm(lon, '동경', '서경')}`, slot = Math.floor(t * 3);
  return [...raw].map((c, i) => /\d/.test(c) && hash(i, slot, 50) < u * 1.15 ? '?' : c).join('');
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000), t = now / 1000; last = now;
  if (homing) {
    const k = Math.min(1, dt * 2.5), dl = ((-HOME[0] - rot[0]) % 360 + 540) % 360 - 180;
    rot[0] += dl * k; rot[1] += (-HOME[1] - rot[1]) * k; z += (1 - z) * k;
    if (Math.abs(dl) < .05 && Math.abs(z - 1) < .004) { homing = false; z = 1; }
  } else if (!drag) {
    rot[0] += spin[0] * dt * 60; rot[1] = clamp(rot[1] + spin[1] * dt * 60, -88, 88);
    spin[0] *= Math.pow(.94, dt * 60); spin[1] *= Math.pow(.94, dt * 60);
    idle += dt; if (idle > 4) rot[0] += dt * 2.2 * clamp((idle - 4) / 2);
  }
  const R = BASE * z, cx = W / 2, cy = H / 2;
  proj.scale(R).translate([cx, cy]).rotate([rot[0], rot[1], 0]);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';



  drawGlobe(R, cx, cy, t);
  window.GLOBE = { R, cx, cy, t, W, H, DPR };
  $('coord').textContent = coordText(t);
  $('zoomv').textContent = `${Math.round(z * 100)}%`;
  $('home').classList.toggle('on', d3.geoDistance(proj.invert([cx, cy]), HOME) > .5 || Math.abs(z - 1) > .05);
  requestAnimationFrame(frame);
}

/* ───── 조작: 끌면 돌고, 핀치·Ctrl휠·버튼으로 확대 ───── */
const zoomBy = f => { z = clamp(z * f, .55, 7); homing = false; };
const pts = new Map();
let pinch = null;
const turn = (dx, dy) => { const k = 57.3 / (BASE * z); rot[0] += dx * k; rot[1] = clamp(rot[1] - dy * k, -88, 88); };
cv.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); cv.setPointerCapture(e.pointerId);
  homing = false; spin = [0, 0]; idle = 0;
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); drag = null; }
  else if (pts.size === 1) { drag = { x: e.clientX, y: e.clientY, t: performance.now() }; cv.classList.add('drag'); }
});
cv.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); idle = 0;
  if (pinch && pts.size >= 2) { const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y); zoomBy(d / pinch); pinch = d; return; }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, now = performance.now(), k = Math.max(1, now - drag.t) / 16.7;
  turn(dx, dy); const s = 57.3 / (BASE * z); spin = [dx * s / k, -dy * s / k];
  drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
  if (!moved) { moved = true; $('hint').style.opacity = 0; }
});
const up = e => {
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  if (!drag) return;
  if (performance.now() - drag.t > 80) spin = [0, 0];
  drag = null; cv.classList.remove('drag');
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => {
  e.preventDefault(); homing = false; idle = 0;
  if (e.ctrlKey || e.metaKey) zoomBy(Math.exp(clamp(-e.deltaY * .012, -.25, .25)));
  else turn(-e.deltaX, -e.deltaY);
}, { passive: false });
let gz = 1;
cv.addEventListener('gesturestart', e => { e.preventDefault(); gz = z; });
cv.addEventListener('gesturechange', e => { e.preventDefault(); z = clamp(gz * e.scale, .55, 7); });
addEventListener('keydown', e => {
  const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (k) { homing = false; idle = 0; spin = [k[0] * -1.2 / z, k[1] * 1.2 / z]; }
  if (e.key === '+' || e.key === '=') zoomBy(1.25);
  if (e.key === '-' || e.key === '_') zoomBy(.8);
});
$('zin').onclick = () => zoomBy(1.4);
$('zout').onclick = () => zoomBy(1 / 1.4);
$('home').onclick = () => { homing = true; spin = [0, 0]; idle = 0; };
addEventListener('resize', resize);
resize();
