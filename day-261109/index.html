<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const INK = '58,42,26';
const TILE = 512, RM = 1500, RING = 72, TH = .5;
let W = 0, H = 0, DPR = 1, cam = { x: 0, y: 0 }, vel = { x: 0, y: 0 };

// 결정적 해시와 값 노이즈: 같은 자리는 언제 그려도 같은 모양이 나온다
function hash(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// 실제 세계: 북극을 가운데 두고 남위 10°까지 펼친 방위등거리도법, 한반도 경도(127°E)가 위쪽
const LON0 = 127, SPAN = 100;
const proj = (lat, lon) => { const r = (90 - lat) / SPAN * (RM - RING), d = (lon - LON0) * Math.PI / 180; return [-r * Math.sin(d), -r * Math.cos(d)]; };
const unproj = (x, y) => { const r = Math.hypot(x, y); let lon = LON0 + Math.atan2(-x, -y) * 180 / Math.PI; lon = ((lon + 540) % 360) - 180; return [90 - r / (RM - RING) * SPAN, lon]; };
const MS = 1600, MK = MS / (2 * RM);
let MA = null, MB = null, COAST = [];
const sampleM = (M, x, y) => {
  if (!M) return 0;
  const u = (x + RM) * MK - .5, v = (y + RM) * MK - .5, i = Math.floor(u), j = Math.floor(v);
  if (i < 0 || j < 0 || i >= MS - 1 || j >= MS - 1) return 0;
  const fx = u - i, fy = v - j, k = j * MS + i;
  return (M[k] * (1 - fx) + M[k + 1] * fx) * (1 - fy) + (M[k + MS] * (1 - fx) + M[k + MS + 1] * fx) * fy;
};
const land = (x, y) => sampleM(MA, x, y), landSoft = (x, y) => sampleM(MB, x, y);
function boxBlur(src, r) {
  const a = new Float32Array(src.length), b = new Float32Array(src.length), n = 2 * r + 1;
  for (let y = 0; y < MS; y++) { let acc = 0; for (let x = -r; x <= r; x++) acc += src[y * MS + clamp(x, 0, MS - 1)]; for (let x = 0; x < MS; x++) { a[y * MS + x] = acc / n; acc += src[y * MS + Math.min(MS - 1, x + r + 1)] - src[y * MS + Math.max(0, x - r)]; } }
  for (let x = 0; x < MS; x++) { let acc = 0; for (let y = -r; y <= r; y++) acc += a[clamp(y, 0, MS - 1) * MS + x]; for (let y = 0; y < MS; y++) { b[y * MS + x] = acc / n; acc += a[Math.min(MS - 1, y + r + 1) * MS + x] - a[Math.max(0, y - r) * MS + x]; } }
  return b;
}
async function loadWorld() {
  const topo = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-50m.json').then(r => r.json());
  const geo = topojson.feature(topo, topo.objects.land), polys = [];
  for (const f of geo.features) { const g = f.geometry; (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).forEach(p => polys.push(p)); }
  const mc = document.createElement('canvas'); mc.width = mc.height = MS;
  const m = mc.getContext('2d', { willReadFrequently: true });
  m.setTransform(MK, 0, 0, MK, RM * MK, RM * MK); m.fillStyle = '#000';
  for (const poly of polys) {
    if (poly[0].every(([, lat]) => lat < -12)) continue;
    m.beginPath();
    for (const ring of poly) ring.forEach(([lon, lat], i) => { const [x, y] = proj(Math.max(lat, -40), lon); i ? m.lineTo(x, y) : m.moveTo(x, y); });
    m.fill('evenodd');
    for (const ring of poly) {
      let cur = [];
      for (let i = 0; i < ring.length; i++) {
        const [lon, lat] = ring[i], prev = ring[i - 1];
        const cutHere = lat < -14 || (prev && Math.abs(lon) > 179.9 && Math.abs(prev[0]) > 179.9);
        if (cutHere) { if (cur.length > 1) COAST.push(cur); cur = []; if (lat < -14) continue; }
        cur.push(proj(lat, lon));
      }
      if (cur.length > 1) COAST.push(cur);
    }
  }
  COAST = COAST.map(pts => { let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity; for (const [x, y] of pts) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); } return { pts, box: [a, b, c, d] }; });
  const px = m.getImageData(0, 0, MS, MS).data, raw = new Float32Array(MS * MS);
  for (let i = 0; i < raw.length; i++) raw[i] = px[i * 4 + 3] / 255;
  MA = boxBlur(raw, 1); MB = boxBlur(boxBlur(raw, 6), 6);
}
// 불확실함: 알려진 세계(0)에서 지도 밖(1)까지
// 불확실함: 지도 가운데(0)에서 눈금 띠 안쪽(.88)으로, 원 밖은 1
const unc = (x, y) => { const r = Math.hypot(x, y); if (r >= RM - RING) return 1; const t = clamp((r / (RM - RING) - .3) / .7); return t * t * (3 - 2 * t) * .88; };
const outside = (x, y) => Math.max(0, Math.hypot(x, y) - RM);

const IMG = {};
const BIG = {};
['m1-serpent', 'm2-dragon', 'm3-whale'].forEach(n => {
  const im = new Image(); im.onload = () => { IMG[n] = im; tiles.clear(); }; im.src = `${n}.webp`;
});
['d1-eastern', 'd2-western', 'd3-leviathan'].forEach(n => { const im = new Image(); im.onload = () => BIG[n] = im; im.src = `${n}.webp`; });
let PAPER = null;
{ const im = new Image(); im.onload = () => PAPER = ctx.createPattern(im, 'repeat'); im.src = 'paper.webp'; }
const FACE = { 'd1-eastern': -1, 'd2-western': 1, 'd3-leviathan': -1 };
const DRAGONS = [
  ['d1-eastern', 195, 1850, -.15, 1], ['d2-western', -30, 1900, .12, 1], ['d3-leviathan', 95, 1900, 0, -1],
  ['d2-western', 245, 1800, .2, -1], ['d1-eastern', 330, 1800, -.25, -1], ['d3-leviathan', 145, 1800, .3, 1],
];
// 실제 지명(Natural Earth 한국어 이름): [이름, x, y, 종류(0 나라·1 바다·2 도시·3 명소), 글자 크기, 도시 이름 방향]
let PLACES = [], RIVERS = [];
async function loadPlaces() {
  const d = await fetch('places.json').then(r => r.json());
  PLACES = d.labels.map(([n, lat, lon, k, sz, side]) => [n, ...proj(lat, lon), k, sz, side]);
  RIVERS = d.rivers.map(seg => { const pts = seg.map(([lat, lon]) => proj(lat, lon)); let a = Infinity, b = Infinity, c = -Infinity, e = -Infinity; for (const [x, y] of pts) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); e = Math.max(e, y); } return { pts, box: [a, b, c, e] }; });
}
const ROSES = [[0, 0], [-760, 380], [620, 560]];

function contour(vals, n, s, x0, y0, th, seg) {
  const P = (i, j) => vals[j * (n + 1) + i];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const a = P(i, j), b = P(i + 1, j), c = P(i + 1, j + 1), d = P(i, j + 1);
    const k = (a > th) | (b > th) << 1 | (c > th) << 2 | (d > th) << 3;
    if (k === 0 || k === 15) continue;
    const X = x0 + i * s, Y = y0 + j * s, L = (p, q) => (th - p) / (q - p);
    const e = [[X + s * L(a, b), Y], [X + s, Y + s * L(b, c)], [X + s * L(d, c), Y + s], [X, Y + s * L(a, d)]];
    const T = { 1: [[3, 0]], 2: [[0, 1]], 3: [[3, 1]], 4: [[1, 2]], 5: [[3, 0], [1, 2]], 6: [[0, 2]], 7: [[3, 2]],
      8: [[2, 3]], 9: [[0, 2]], 10: [[0, 1], [2, 3]], 11: [[1, 2]], 12: [[1, 3]], 13: [[0, 1]], 14: [[0, 3]] }[k];
    for (const [p, q] of T) seg(e[p][0], e[p][1], e[q][0], e[q][1]);
  }
}
const jit = (x, y, u) => { const k = u * u * 26; return [x + (vnoise(x * .045, y * .045, 7) - .5) * 2 * k, y + (vnoise(x * .045, y * .045, 8) - .5) * 2 * k]; };

function line(g, pts, u, w, a, broken) {
  g.lineWidth = w;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], uu = unc(x1, y1);
    if (uu > .98 || (broken && hash(x1 | 0, y1 | 0, 5) < (uu - .45) * 1.5)) continue;
    g.strokeStyle = `rgba(${INK},${a * (1 - uu * .9)})`;
    const [p, q] = jit(x1, y1, uu), [r, s] = jit(x2, y2, uu);
    g.beginPath(); g.moveTo(p, q); g.lineTo(r, s); g.stroke();
  }
}

function spaced(g, text, x, y, sp) {
  const ch = [...text], ws = ch.map(c => g.measureText(c).width), tot = ws.reduce((a, b) => a + b, 0) + sp * (ch.length - 1);
  let cx = x - tot / 2;
  ch.forEach((c, i) => { g.fillText(c, cx + ws[i] / 2, y); cx += ws[i] + sp; });
}
function rose(g, x, y, r) {
  g.save(); g.translate(x, y);
  g.strokeStyle = `rgba(${INK},.7)`; g.lineWidth = .8;
  [r, r * .82, r * .3].forEach(q => { g.beginPath(); g.arc(0, 0, q, 0, 6.283); g.stroke(); });
  for (let k = 0; k < 16; k++) {
    const a = k / 16 * 6.283 - Math.PI / 2, L = k % 4 === 0 ? r : k % 2 === 0 ? r * .7 : r * .45, wq = L * .13;
    for (let side = 0; side < 2; side++) {
      g.beginPath(); g.moveTo(0, 0);
      g.lineTo(Math.cos(a) * L, Math.sin(a) * L);
      g.lineTo(Math.cos(a + (side ? 1 : -1) * Math.PI / 2) * wq, Math.sin(a + (side ? 1 : -1) * Math.PI / 2) * wq);
      g.closePath();
      g.fillStyle = side ? `rgba(${INK},.85)` : `rgba(${INK},.12)`; g.fill(); g.stroke();
    }
  }
  g.fillStyle = `rgba(${INK},.9)`; g.font = `900 ${r * .2}px 'Noto Serif KR'`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('북', 0, -r - r * .16);
  g.restore();
}

function ray(g, x0, y0, ax, ay, dx, dy, t0, t1, w, a) {
  for (const [o, d, lo, hi] of [[ax, dx, x0, x0 + TILE], [ay, dy, y0, y0 + TILE]]) {
    if (Math.abs(d) < 1e-6) { if (o < lo || o > hi) return; continue; }
    let a1 = (lo - o) / d, a2 = (hi - o) / d; if (a1 > a2) [a1, a2] = [a2, a1];
    t0 = Math.max(t0, a1); t1 = Math.min(t1, a2);
  }
  if (t0 >= t1) return;
  const p = []; for (let t = t0; t < t1 + 48; t += 48) p.push([ax + dx * Math.min(t, t1), ay + dy * Math.min(t, t1)]);
  line(g, p, 0, w, a, true);
}

function renderTile(tx, ty) {
  const D = Math.min(2, DPR), c = document.createElement('canvas');
  c.width = c.height = TILE * D;
  const g = c.getContext('2d'), x0 = tx * TILE, y0 = ty * TILE;
  g.scale(D, D); g.translate(-x0, -y0); g.lineCap = 'round';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const near = (x, y, m) => x > x0 - m && x < x0 + TILE + m && y > y0 - m && y < y0 + TILE + m;
  const RI = RM - RING;
  g.save(); g.beginPath(); g.arc(0, 0, RI, 0, 6.283); g.clip();

  for (let k = 0; k < 36; k++) { const a = k / 36 * 6.283; ray(g, x0, y0, 0, 0, Math.cos(a), Math.sin(a), 0, RI, k % 9 === 0 ? .9 : .55, k % 9 === 0 ? .4 : .22); }
  for (let r = 250; r < RI; r += 250) {
    const p = []; for (let k = 0; k <= 240; k++) { const a = k / 240 * 6.283, x = Math.cos(a) * r, y = Math.sin(a) * r; if (near(x, y, 40)) p.push([x, y]); else if (p.length) { line(g, p, 0, r === 750 ? 1 : .55, r === 750 ? .45 : .22, true); p.length = 0; } }
    if (p.length) line(g, p, 0, r === 750 ? 1 : .55, r === 750 ? .45 : .22, true);
  }
  for (const [rx, ry] of ROSES) for (let k = 0; k < 32; k++) { const a = k / 32 * 6.283; ray(g, x0, y0, rx, ry, Math.cos(a), Math.sin(a), 0, 2600, .45, k % 4 === 0 ? .16 : .08); }
  const s = 8, n = TILE / s, vals = new Float32Array((n + 1) * (n + 1));
  for (let j = 0; j <= n; j++) for (let i = 0; i <= n; i++) vals[j * (n + 1) + i] = landSoft(x0 + i * s, y0 + j * s);
  [[.3, .5], [.17, .36], [.08, .22]].forEach(([th, a]) => contour(vals, n, s, x0, y0, th, (a1, b, c2, d) => line(g, [[a1, b], [c2, d]], 0, .6, a, true)));
  for (const { pts, box } of RIVERS) {
    if (box[2] < x0 - 20 || box[0] > x0 + TILE + 20 || box[3] < y0 - 20 || box[1] > y0 + TILE + 20) continue;
    line(g, pts, 0, .8, .55, true);
  }
  for (const { pts, box } of COAST) {
    if (box[2] < x0 - 40 || box[0] > x0 + TILE + 40 || box[3] < y0 - 40 || box[1] > y0 + TILE + 40) continue;
    line(g, pts, 0, 1.5, .92, true);
  }

  for (let y = Math.ceil(y0 / 36) * 36; y < y0 + TILE; y += 36) for (let x = Math.ceil(x0 / 36) * 36; x < x0 + TILE; x += 36) {
    const uu = unc(x, y);
    if (hash(x, y, 11) > .25 || hash(x, y, 12) < uu * 1.3 || landSoft(x, y) < .9) continue;
    const z = 6 + hash(x, y, 13) * 7, [px, py] = jit(x + (hash(x, y, 14) - .5) * 24, y, uu);
    g.strokeStyle = `rgba(${INK},${.75 * (1 - uu)})`; g.lineWidth = .9;
    g.beginPath(); g.moveTo(px - z, py + z * .5); g.lineTo(px, py - z * .6); g.lineTo(px + z, py + z * .5); g.stroke();
    g.beginPath(); g.moveTo(px + z * .15, py - z * .3); g.lineTo(px + z * .5, py + z * .45); g.stroke();
  }

  for (const [name, px, py, kind, sz, side] of PLACES) {
    if (!near(px, py, 200)) continue;
    const uu = unc(px, py), hk = name.length * 7 + (px | 0);
    if (uu > .82) continue;
    const txt = [...name].map((ch, i) => ch !== ' ' && hash(hk, i, 30) < uu * 1.2 ? '?' : ch).join('');
    g.save(); g.translate(...jit(px, py, uu)); g.rotate(uu * (hash(hk, 1, 25) - .5) * .6);
    g.fillStyle = `rgba(${INK},${.15 + .8 * (1 - uu)})`;
    if (kind === 2) {
      g.beginPath(); g.arc(0, 0, 2.4, 0, 6.283); g.fill();
      g.font = `500 ${sz}px 'Noto Serif KR'`; g.textAlign = side < 0 ? 'right' : 'left'; g.fillText(txt, side * 6, -1); g.textAlign = 'center';
    } else if (kind === 3) {
      g.transform(1, 0, -.2, 1, 0, 0); g.font = `500 ${sz}px 'Noto Serif KR'`; g.fillStyle = `rgba(${INK},${.1 + .6 * (1 - uu)})`; spaced(g, txt, 0, 0, 2);
    } else {
      g.transform(1, 0, kind ? -.2 : 0, 1, 0, 0);
      g.font = `${kind ? 500 : 900} ${sz}px 'Noto Serif KR'`;
      spaced(g, txt, 0, 0, kind ? 7 : 4);
    }
    g.restore();
  }

  const MC = 1000, names = Object.keys(IMG);
  if (names.length) for (let cy = Math.floor((y0 - 450) / MC); cy <= Math.floor((y0 + TILE + 450) / MC); cy++)
    for (let cx = Math.floor((x0 - 450) / MC); cx <= Math.floor((x0 + TILE + 450) / MC); cx++) {
      const px = (cx + .25 + .5 * hash(cx, cy, 61)) * MC, py = (cy + .25 + .5 * hash(cx, cy, 62)) * MC, uu = unc(px, py);
      if (uu < .42 || uu >= 1 || hash(cx, cy, 60) > .6 || landSoft(px, py) > .05) continue;
      const im = IMG[names[hash(cx, cy, 63) * names.length | 0]], sz = 230 + 190 * hash(cx, cy, 64);
      g.save(); g.translate(px, py); g.rotate((hash(cx, cy, 65) - .5) * .35); if (hash(cx, cy, 66) < .5) g.scale(-1, 1);
      g.globalAlpha = clamp((uu - .42) / .15) * .85;
      g.drawImage(im, -sz / 2, -sz / 2, sz, sz); g.restore();

  for (const [rx, ry] of ROSES) if (near(rx, ry, 160)) rose(g, rx, ry, rx === 0 && ry === 0 ? 60 : 84);
  if (near(0, 0, 120)) { g.fillStyle = `rgba(${INK},.85)`; g.font = `900 14px 'Noto Serif KR'`; spaced(g, '북극', 0, 78, 6); }
  g.restore();

  // 바깥 눈금 띠: 세 겹 원, 5°마다 칠한 칸, 10°마다 숫자
  if (Math.hypot(Math.max(Math.abs(x0 + TILE / 2) - TILE / 2, 0), Math.max(Math.abs(y0 + TILE / 2) - TILE / 2, 0)) < RM + 10) {
    g.strokeStyle = `rgba(${INK},.85)`;
    [[RM - 2, 2.2], [RM - 26, .8], [RM - 44, .8], [RI, 1.4]].forEach(([r, w]) => { g.lineWidth = w; g.beginPath(); g.arc(0, 0, r, 0, 6.283); g.stroke(); });
    g.fillStyle = `rgba(${INK},.8)`;
    for (let k = 0; k < 72; k += 2) { g.beginPath(); g.arc(0, 0, RM - 26, k / 72 * 6.283, (k + 1) / 72 * 6.283); g.arc(0, 0, RM - 44, (k + 1) / 72 * 6.283, k / 72 * 6.283, true); g.fill(); }
    g.font = `500 13px 'Noto Serif KR'`;
    for (let k = 0; k < 36; k++) {
      const a = k / 36 * 6.283 - Math.PI / 2, x = Math.cos(a) * (RM - 14), y = Math.sin(a) * (RM - 14);
      if (!near(x, y, 30)) continue;
      g.save(); g.translate(x, y); g.rotate(a + Math.PI / 2); g.fillText(String(k * 10), 0, 0); g.restore();
    }
  }

}

const tiles = new Map();
let drag = null, homing = false, moved = false, last = performance.now();
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}

function coordText(t) {
  const uu = unc(cam.x, cam.y);
  if (outside(cam.x, cam.y) > 0) return '여기는 지도 밖입니다';
  const dm = (v, a, b) => { const d = Math.abs(v), D = Math.floor(d), M = Math.floor((d - D) * 60); return `${v >= 0 ? a : b} ${D}° ${String(M).padStart(2, '0')}′`; };
  const [lat, lon] = unproj(cam.x, cam.y);
  if (Math.hypot(cam.x, cam.y) < 8) return '북극점   북위 90°';
  const raw = `${dm(lat, '북위', '남위')}   ${dm(lon, '동경', '서경')}`, slot = Math.floor(t * 3);
  return [...raw].map((c, i) => /\d/.test(c) && hash(i, slot, 50) < uu * 1.15 ? '?' : c).join('');
}

function curved(text, cx, cy, r, mid, sp, bottom) {
  const ch = [...text], ws = ch.map(c => ctx.measureText(c).width + sp), tot = ws.reduce((a, b) => a + b, 0) - sp;
  let cum = 0;
  ch.forEach((c, i) => {
    const off = (cum + (ws[i] - sp) / 2) / r, a = bottom ? mid + tot / r / 2 - off : mid - tot / r / 2 + off;
    ctx.save(); ctx.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.rotate(bottom ? a - Math.PI / 2 : a + Math.PI / 2);
    ctx.fillText(c, 0, 0); ctx.restore(); cum += ws[i];
  });
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000), t = now / 1000; last = now;
  if (homing) {
    cam.x += (0 - cam.x) * Math.min(1, dt * 2.2); cam.y += (0 - cam.y) * Math.min(1, dt * 2.2);
    if (Math.hypot(cam.x, cam.y) < 1) homing = false;
  } else if (!drag) {
    cam.x += vel.x * dt * 60; cam.y += vel.y * dt * 60;
    vel.x *= Math.pow(.92, dt * 60); vel.y *= Math.pow(.92, dt * 60);
    const o = outside(cam.x, cam.y);
    if (o > 2300) { const k = (o - 2300) / (o + RM) * Math.min(1, dt * 3); cam.x -= cam.x * k; cam.y -= cam.y * k; }
  }
  const ox = W / 2 - cam.x, oy = H / 2 - cam.y;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // 지도 밖: 어둠 속을 떠도는 이름 잃은 글자들
  const LC = 210;
  for (let cy = Math.floor((cam.y - H / 2) / LC) - 1; cy <= Math.floor((cam.y + H / 2) / LC) + 1; cy++)
    for (let cx = Math.floor((cam.x - W / 2) / LC) - 1; cx <= Math.floor((cam.x + W / 2) / LC) + 1; cx++) {
      const px = (cx + hash(cx, cy, 41)) * LC, py = (cy + hash(cx, cy, 42)) * LC, d = outside(px, py), h = hash(cx, cy, 40);
      if (d < 140 || h > .3) continue;
      const ch = h < .07 ? '지도밖'[hash(cx, cy, 43) * 3 | 0] : String.fromCharCode(0xAC00 + (hash(cx, cy, 44) * 11172 | 0));
      const sz = 14 + 50 * hash(cx, cy, 45) ** 2;
      ctx.font = `${h < .07 ? 900 : 500} ${sz}px 'Noto Serif KR'`;
      ctx.fillStyle = `rgba(226,200,140,${clamp((d - 140) / 500) * (.22 + .18 * Math.sin(t * .6 + h * 90))})`;
      ctx.save(); ctx.translate(px + ox + Math.sin(t * .25 + h * 50) * 14, py + oy + Math.cos(t * .21 + h * 70) * 10);
      ctx.rotate(Math.sin(t * .15 + h * 30) * .3); ctx.fillText(ch, 0, 0); ctx.restore();
    }

  // 원 둘레를 헤엄치며 도는 용들: 세로 띠로 잘라 몸을 굽이치게(동양 용·리바이어던) 하거나 날개를 퍼덕인다(서양 용)
  DRAGONS.forEach(([n, deg, dist, rot, flip], k) => {
    const im = BIG[n]; if (!im) return;
    const a = (deg + t * 1.6) * Math.PI / 180, w = 1350 - (k % 3) * 120, h = w * im.height / im.width;
    const x = Math.cos(a) * dist + ox, y = Math.sin(a) * dist + oy;
    if (x + w * .6 < 0 || x - w * .6 > W || y + h * .6 < 0 || y - h * .6 > H) return;
    const tanX = -Math.sin(a), tanY = Math.cos(a), face = FACE[n] * flip;
    const sx = clamp(tanX * 3, -1, 1) * face;
    ctx.save(); ctx.translate(x, y); ctx.rotate(clamp(tanY * Math.sign(tanX || 1), -1, 1) * .22 + rot * .3); ctx.scale(Math.abs(sx) < .12 ? .12 * Math.sign(sx || 1) : sx, 1);
    const N = 60, sw = im.width / N, cw = w / N, wing = n === 'd2-western';
    for (let i = 0; i < N; i++) {
      const nx = (i + .5) / N * 2 - 1;
      const dy = wing
        ? -Math.sin(t * 2.4 + k) * h * .09 * Math.pow(Math.abs(nx), 1.6) + Math.sin(t * 2.4 + k + 1.2) * h * .015
        : Math.sin(nx * Math.PI * 2.2 - t * 1.7 - k) * h * .045 * (.4 + .6 * Math.abs(nx));
      const sy = wing ? 1 + Math.sin(t * 2.4 + k) * .04 * Math.abs(nx) : 1;
      ctx.drawImage(im, i * sw, 0, sw + .5, im.height, -w / 2 + i * cw, -h / 2 * sy + dy, cw + .6, h * sy);
    }
    ctx.restore();
  });

  // 원형 지도 한 장
  ctx.save(); ctx.beginPath(); ctx.arc(ox, oy, RM, 0, 6.283);
  ctx.shadowColor = 'rgba(0,0,0,.75)'; ctx.shadowBlur = 70;
  if (PAPER) PAPER.setTransform(new DOMMatrix([1, 0, 0, 1, ox, oy]));
  ctx.fillStyle = PAPER || '#e3d2ad'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(ox, oy, RM, 0, 6.283); ctx.clip();
  const tx0 = Math.floor((cam.x - W / 2) / TILE), tx1 = Math.floor((cam.x + W / 2) / TILE);
  const ty0 = Math.floor((cam.y - H / 2) / TILE), ty1 = Math.floor((cam.y + H / 2) / TILE);
  const todo = [];
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    if (Math.hypot(Math.max(Math.abs((tx + .5) * TILE) - TILE / 2, 0), Math.max(Math.abs((ty + .5) * TILE) - TILE / 2, 0)) > RM) continue;
    const k = tx + ',' + ty, c = tiles.get(k);
    if (c) { tiles.delete(k); tiles.set(k, c); ctx.drawImage(c, tx * TILE + ox, ty * TILE + oy, TILE, TILE); }
    else todo.push([Math.hypot((tx + .5) * TILE - cam.x, (ty + .5) * TILE - cam.y), tx, ty]);
  }
  todo.sort((a, b) => a[0] - b[0]).slice(0, 3).forEach(([, tx, ty]) => {
    const c = renderTile(tx, ty); tiles.set(tx + ',' + ty, c);
    ctx.drawImage(c, tx * TILE + ox, ty * TILE + oy, TILE, TILE);
  });
  while (tiles.size > 140) tiles.delete(tiles.keys().next().value);
  const burn = ctx.createRadialGradient(ox, oy, RM * .8, ox, oy, RM);
  burn.addColorStop(0, 'rgba(90,55,20,0)'); burn.addColorStop(1, 'rgba(90,55,20,.3)');
  ctx.fillStyle = burn; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  ctx.fillStyle = 'rgba(232,206,146,.92)';
  ctx.font = `900 40px 'Noto Serif KR'`; curved('여기서부터는 용이 산다', ox, oy, RM + 58, -Math.PI / 2, 14);
  ctx.font = `500 26px 'Noto Serif KR'`; curved('HIC  SVNT  DRACONES', ox, oy, RM + 56, Math.PI / 2, 16, true);

  const o = outside(cam.x, cam.y);
  document.body.classList.toggle('out', o > 0);
  $('coord').textContent = coordText(t);
  $('home').classList.toggle('on', Math.hypot(cam.x, cam.y) > 900);
  requestAnimationFrame(frame);
}

/* ───── 조작 ───── */
cv.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, t: performance.now() }; homing = false; vel.x = vel.y = 0;
  cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, now = performance.now(), k = Math.max(1, now - drag.t) / 16.7;
  cam.x -= dx; cam.y -= dy; vel.x = -dx / k; vel.y = -dy / k;
  drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
  if (!moved && Math.hypot(cam.x, cam.y) > 40) { moved = true; $('hint').style.opacity = 0; }
});
const up = () => { if (!drag) return; if (performance.now() - drag.t > 80) vel.x = vel.y = 0; drag = null; cv.classList.remove('drag'); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); homing = false; cam.x += e.deltaX; cam.y += e.deltaY; }, { passive: false });
addEventListener('keydown', e => {
  const k = { ArrowLeft: [-14, 0], ArrowRight: [14, 0], ArrowUp: [0, -14], ArrowDown: [0, 14] }[e.key];
  if (k) { homing = false; vel.x = k[0]; vel.y = k[1]; }
});
$('home').onclick = () => { homing = true; vel.x = vel.y = 0; };
addEventListener('resize', resize);
resize();
Promise.all([document.fonts.load(`900 20px 'Noto Serif KR'`, '알려진세계용'), document.fonts.load(`500 20px 'Noto Serif KR'`, '바다'), loadWorld().catch(e => console.warn('세계 지도 데이터를 불러오지 못했어요', e)), loadPlaces().catch(e => console.warn('지명을 불러오지 못했어요', e))])
  .then(() => { tiles.clear(); requestAnimationFrame(frame); });
</script>
</body>
</html>
