<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>

<script>
const cv = document.getElementById('cv'); let ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const INK = '58,42,26', HOME = [127, 37.5], DEG = 180 / Math.PI;
let W = 0, H = 0, DPR = 1, BASE = 300, z = 1, rot = [-HOME[0], -HOME[1]], spin = [0, 0];
let drag = null, homing = false, moved = false, idle = 0, last = performance.now();
// 사용자가 직접 돌린 누적 각도. 세 바퀴부터 일곱 바퀴까지 Q 가 0→1 로 오르며 지도가 흐려지고 용이 떠오른다
let spun = 0, Q = 0;
const REVEAL_FROM = 1080, REVEAL_SPAN = 1440;

function hash(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// 알려진 정도: 서울에서 45°까지는 또렷하고(0), 지구 반대편으로 갈수록 모른다(.92)
const unc = (lon, lat) => { const t = clamp((d3.geoDistance([lon, lat], HOME) * DEG - 45) / 100); return t * t * (3 - 2 * t) * .92; };
// 모르는 곳일수록 위치가 어긋나게 베껴 그린 선
const jit = (lon, lat, u) => { const k = u * u * 2.4; return [lon + (vnoise(lon * .6, lat * .6, 7) - .5) * 2 * k, lat + (vnoise(lon * .6, lat * .6, 8) - .5) * 2 * k]; };

const proj = d3.geoOrthographic().clipAngle(90).precision(0);
const path = d3.geoPath(proj, ctx);
const GRAT = d3.geoGraticule10();
let COAST = [], COAST_FINE = [], COAST0 = [], COAST_FINE0 = [], RIVER0 = [], RIVER = [], LABELS = [], UNKNOWN = [], PHRASE = [];

// 선을 짧은 조각으로 나누고, 알려진 정도별로 10묶음으로 모아 둔다
function cleanLines(lines) { return [{ u: 0, geo: { type: 'MultiLineString', coordinates: lines.filter(l => l.length > 1) } }]; }
function bucketLines(lines, step, drop) {
  const B = Array.from({ length: 10 }, () => []);
  for (const ln of lines) for (let i = 0; i < ln.length - 1; i += step) {
    const seg = ln.slice(i, i + step + 1), [lon, lat] = seg[0], u = unc(lon, lat);
    if (drop && hash(lon * 100 | 0, lat * 100 | 0, 5) < (u - .45) * 1.5) continue;
    B[Math.min(9, u * 10 | 0)].push(seg.map(([a, b]) => jit(a, b, unc(a, b))));
  }
  return B.map((c, i) => ({ u: (i + .5) / 10, geo: { type: 'MultiLineString', coordinates: c } }));
}

async function loadWorld() {
  const [topo, small, places] = await Promise.all([
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-50m.json').then(r => r.json()),
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(r => r.json()),
    fetch('places.json').then(r => r.json()),
  ]);
  // 멀리서는 가벼운 1:1억1천만, 확대하면 정밀한 1:5천만 해안선
  const ringsOf = t => { const out = []; for (const f of topojson.feature(t, t.objects.land).features) { const g = f.geometry; (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).forEach(p => p.forEach(r => out.push(r.filter(([, lat]) => lat > -84)))); } return out; };
  const small_ = ringsOf(small), fine_ = ringsOf(topo), rivers_ = places.rivers.map(seg => seg.map(([lat, lon]) => [lon, lat]));
  COAST0 = cleanLines(small_); COAST_FINE0 = cleanLines(fine_); RIVER0 = cleanLines(rivers_);
  COAST = bucketLines(small_, 4, true);
  COAST_FINE = bucketLines(fine_, 10, true);
  RIVER = bucketLines(rivers_, 8, true);
  LABELS = places.labels.map(([n, lat, lon, k, sz, side]) => {
    const u = unc(lon, lat);
    return { name: n, ch: [...n], hk: n.length * 7 + (lon * 10 | 0), p0: [lon, lat], pj: jit(lon, lat, u), p: [lon, lat], k, sz, side, u };
  });
  for (let lat = -78; lat <= 80; lat += 7) for (let lon = -180; lon < 180; lon += 7 / Math.max(.25, Math.cos(lat / DEG))) {
    const u = unc(lon, lat);
    if (u > .78 && hash(lon * 10 | 0, lat * 10 | 0, 71) < .3) UNKNOWN.push({ p: [lon + hash(lon | 0, lat | 0, 72) * 4, lat + hash(lon | 0, lat | 0, 73) * 4], u, s: hash(lon | 0, lat | 0, 74) });
  }
  PHRASE = d3.geoCircle().center(HOME).radius(118).precision(36)().coordinates[0].slice(0, -1);
}


let PAPER = null;
{ const im = new Image(); im.onload = () => { PAPER = ctx.createPattern(im, 'repeat'); delete LAYERS.base; }; im.src = 'paper.webp'; }

function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; BASE = Math.min(W, H) * .36;
}

// 반지름이 정해지면 변하지 않는 그림은 판 하나에 미리 그려 둔다(반지름 4% 단위로 다시 그림)
const LAYERS = {};
function layer(name, R, pad, paint) {
  const q = Math.round(Math.log(R) / Math.log(1.04)), Rq = Math.pow(1.04, q), size = Math.ceil((Rq + pad * Rq) * 2 * DPR);
  if (size > 4600) return null;
  let L = LAYERS[name];
  if (!L || L.q !== q || L.dpr !== DPR) {
    const c = L?.c || document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, size, size);
    const o = Rq * (1 + pad); paint(g, Rq, o, o);
    L = LAYERS[name] = { c, q, dpr: DPR, Rq, half: o };
  }
  return L;
}
function put(L, R, cx, cy) { const k = R / L.Rq, h = L.half * k; ctx.drawImage(L.c, cx - h, cy - h, h * 2, h * 2); }
function paintBase(g, R, cx, cy, direct) {
  const g0 = g.createRadialGradient(cx - R * .35, cy - R * .4, R * .05, cx, cy, R * 1.02);
  g0.addColorStop(0, '#f6ead0'); g0.addColorStop(.55, '#e2cfa6'); g0.addColorStop(1, '#a88a5a');
  g.save(); if (!direct) { g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = R * .12; } g.fillStyle = g0; g.beginPath(); g.arc(cx, cy, R, 0, 6.283); g.fill(); g.restore();
  if (PAPER) { g.save(); g.beginPath(); g.arc(cx, cy, R, 0, 6.283); g.clip(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = .55; g.fillStyle = PAPER; g.fillRect(0, 0, cx * 2, cy * 2); g.restore(); }
}
function paintShade(g, R, cx, cy) {
  const g1 = g.createRadialGradient(cx - R * .3, cy - R * .35, R * .2, cx, cy, R);
  g1.addColorStop(0, 'rgba(255,248,230,.18)'); g1.addColorStop(.6, 'rgba(90,60,25,0)'); g1.addColorStop(1, 'rgba(60,35,12,.55)');
  g.fillStyle = g1; g.beginPath(); g.arc(cx, cy, R, 0, 6.283); g.fill();
}
function paintRing(g, R, cx, cy) {
  const keep = ctx; ctx = g;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = 'rgba(214,184,120,.85)'; ctx.fillStyle = 'rgba(214,184,120,.85)';
  [[R + 6, 1.4], [R + 22, .8], [R + 34, .8], [R + 48, 1.6]].forEach(([r, w]) => { ctx.lineWidth = w; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.stroke(); });
  for (let k = 0; k < 72; k += 2) { ctx.beginPath(); ctx.arc(cx, cy, R + 22, k / 72 * 6.283, (k + 1) / 72 * 6.283); ctx.arc(cx, cy, R + 34, (k + 1) / 72 * 6.283, k / 72 * 6.283, true); ctx.fill(); }
  ctx = keep;
}

function drawGlobe(R, cx, cy, t) {
  const center = proj.invert([cx, cy]);
  const base = layer('base', R, .16, paintBase);
  if (base) put(base, R, cx, cy); else paintBase(ctx, R, cx, cy, true);
  ctx.save(); ctx.beginPath(); path({ type: 'Sphere' }); ctx.clip();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); path(GRAT); ctx.strokeStyle = `rgba(${INK},.17)`; ctx.lineWidth = .6; ctx.stroke();
  ctx.beginPath(); path({ type: 'LineString', coordinates: [[-180, 0], [-90, 0], [0, 0], [90, 0], [180, 0]] }); ctx.strokeStyle = `rgba(${INK},.35)`; ctx.lineWidth = 1; ctx.stroke();
  const lw = clamp(Math.sqrt(z), 1, 2.2);
  const fine = z >= 1.8 && COAST_FINE.length;
  for (const [set, fade] of [[fine ? COAST_FINE0 : COAST0, 1 - Q], [fine ? COAST_FINE : COAST, Q]]) for (const { u, geo } of set) {
    if (!geo.coordinates.length || fade < .01) continue;
    ctx.globalAlpha = fade;
    ctx.beginPath(); path(geo);
    ctx.setLineDash(u > .5 ? [5 * lw, (3 + u * 8) * lw] : []);
    if (z < 3) { ctx.strokeStyle = `rgba(${INK},${.1 * (1 - u)})`; ctx.lineWidth = 7 * lw; ctx.stroke(); }
    ctx.strokeStyle = `rgba(${INK},${.92 * (1 - u * .8)})`; ctx.lineWidth = 1.25 * lw; ctx.stroke();
  }
  for (const [set, fade] of [[RIVER0, 1 - Q], [RIVER, Q]]) for (const { u, geo } of set) {
    if (!geo.coordinates.length || fade < .01) continue;
    ctx.globalAlpha = fade;
    ctx.beginPath(); path(geo); ctx.setLineDash(u > .5 ? [3, 4 + u * 6] : []);
    ctx.strokeStyle = `rgba(${INK},${.5 * (1 - u)})`; ctx.lineWidth = .7 * lw; ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  // 지명: 지구 표면에 인쇄된 것처럼, 글자마다 그 자리의 위선 방향과 구의 기울기를 따른다
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const boxes = [], fs = clamp(Math.pow(z, .45), 1, 2.4), hit = b => boxes.some(o => !(b[2] < o[0] || o[2] < b[0] || b[3] < o[1] || o[3] < b[1]));
  const K = fs / (R * Math.PI / 180);
  const frameAt = (lon, lat) => {
    const c = Math.max(Math.cos(lat / DEG), .05), p0 = proj([lon, lat]), pe = proj([lon + .4, lat]), up = lat < 89 ? .4 : -.4, pn = proj([lon, lat + up]);
    return [p0, (pe[0] - p0[0]) / (.4 * c), (pe[1] - p0[1]) / (.4 * c), (pn[0] - p0[0]) / up, (pn[1] - p0[1]) / up, c];
  };
  // 한 줄을 위선을 따라 글자별로 놓는다. align: -1 오른쪽 끝, 0 가운데, 1 왼쪽 끝
  function surface(txt, lon, lat, sz, sp, skew, align, fade) {
    const ch = [...txt], ws = ch.map(c => ctx.measureText(c).width), tot = ws.reduce((a, b) => a + b, 0) + sp * (ch.length - 1);
    let cum = align === 0 ? -tot / 2 : align < 0 ? -tot : 0;
    const c0 = Math.max(Math.cos(lat / DEG), .05);
    ch.forEach((c, i) => {
      const lo = lon + (cum + ws[i] / 2) * K / c0; cum += ws[i] + sp;
      const d = d3.geoDistance([lo, lat], center); if (d > 1.52) return;
      const [p0, ex, ey, nx, ny] = frameAt(lo, lat), a = ex * K, b = ey * K, cc = -nx * K, dd = -ny * K;
      ctx.globalAlpha = fade * clamp((1.52 - d) / .3);
      ctx.setTransform(DPR * a, DPR * b, DPR * (cc + a * skew), DPR * (dd + b * skew), DPR * p0[0], DPR * p0[1]);
      ctx.fillText(c, 0, 0);
    });
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1;
  }
  for (const L of LABELS) {
    const uq = L.u * Q; if (uq > .82) continue;
    L.p[0] = L.p0[0] + (L.pj[0] - L.p0[0]) * Q; L.p[1] = L.p0[1] + (L.pj[1] - L.p0[1]) * Q;
    L.txt = L.ch.map((ch, i) => ch !== ' ' && hash(L.hk, i, 30) < uq * 1.2 ? '?' : ch).join('');
    const d = d3.geoDistance(L.p, center); if (d > 1.5) continue;
    const [x, y] = proj(L.p); if (x < -150 || y < -60 || x > W + 150 || y > H + 60) continue;
    const sp = L.k === 1 ? 6 : L.k === 0 ? 3 : 0;
    ctx.font = `${L.k === 0 ? 900 : 500} ${L.sz}px 'Noto Serif KR'`;
    if (!L.w) L.w = ctx.measureText(L.name).width / L.sz;
    // 겹침 검사용 상자: 가장자리일수록 옆으로 눌린 폭
    const squash = Math.max(.15, Math.cos(d)), w = (L.w * L.sz + sp * [...L.txt].length) * fs * squash, h = L.sz * fs * .7;
    const b = L.k === 2 ? (L.side < 0 ? [x - w - 8, y - h, x + 3, y + h] : [x - 3, y - h, x + w + 8, y + h]) : [x - w / 2, y - h, x + w / 2, y + h];
    if (hit(b)) continue; boxes.push(b);
    const a = (.18 + .8 * (1 - uq)) * (L.k === 3 ? .7 : 1);
    ctx.fillStyle = `rgba(${INK},1)`;
    const [lon, lat] = L.p;
    if (L.k === 2) {
      const [p0, ex, ey, nx, ny] = frameAt(lon, lat);
      ctx.globalAlpha = a * clamp((1.52 - d) / .3);
      ctx.setTransform(DPR * ex * K, DPR * ey * K, -DPR * nx * K, -DPR * ny * K, DPR * p0[0], DPR * p0[1]);
      ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, 6.283); ctx.fill();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1;
      surface(' ' + L.txt, lon + L.side * 4 * K / Math.max(Math.cos(lat / DEG), .05), lat, L.sz, 0, 0, L.side, a);
    } else surface(L.txt, lon, lat, L.sz, sp, L.k ? -.2 : 0, 0, a);
  }
  // 지구 반대편: 물음표와 '여기서부터는 용이 산다'
  for (const q of Q > .02 ? UNKNOWN : []) {
    const d = d3.geoDistance(q.p, center); if (d > 1.5) continue;
    ctx.font = `500 ${12 + q.s * 16}px 'Noto Serif KR'`; ctx.fillStyle = `rgba(${INK},1)`;
    surface('?', q.p[0], q.p[1], 0, 0, 0, 0, Q * (.2 + .25 * Math.sin(t * .8 + q.s * 40)));
  }
  ctx.font = `900 20px 'Noto Serif KR'`; ctx.fillStyle = `rgba(${INK},1)`;
  for (const p of Q > .02 ? PHRASE : []) {
    if (d3.geoDistance(p, center) > 1.5) continue;
    surface('여기서부터는 용이 산다', p[0], p[1], 20, 4, 0, 0, .8 * Q);
  }
  if (R < Math.hypot(W, H) * .8) { const shade = layer('shade', R, .02, paintShade); if (shade) put(shade, R, cx, cy); else paintShade(ctx, R, cx, cy); }
  ctx.restore();

  const diag = Math.hypot(W, H) / 2;
  if (R < diag) { const ring = layer('ring', R, .22, paintRing); if (ring) put(ring, R, cx, cy); else paintRing(ctx, R, cx, cy); }
}


function coordText(t) {
  const [lon, lat] = proj.invert([W / 2, H / 2]), u = unc(lon, lat) * Q;
  if (u > .86) return '여기는 지도 밖입니다';
  const dm = (v, a, b) => { const d = Math.abs(v), D = Math.floor(d), M = Math.floor((d - D) * 60); return `${v >= 0 ? a : b} ${D}° ${String(M).padStart(2, '0')}′`; };
  const raw = `${dm(lat, '북위', '남위')}   ${dm(lon, '동경', '서경')}`, slot = Math.floor(t * 3);
  return [...raw].map((c, i) => /\d/.test(c) && hash(i, slot, 50) < u * 1.15 ? '?' : c).join('');
}

/* ───── 소리와 떨림: 돌릴수록 다른 세계로 넘어가는 느낌 ───── */
let AC = null, SND = null, muted = false, shake = 0, lastTurn = 0;
function startSound() {
  if (AC) { if (AC.state === 'suspended' && !muted) AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const sr = AC.sampleRate, mk = (fn) => { const b = AC.createBuffer(1, sr * 4, sr), d = b.getChannelData(0); let l = 0; for (let i = 0; i < d.length; i++) d[i] = fn(Math.random() * 2 - 1, v => l = v, l); return b; };
  const white = mk(w => w * .5), brown = mk((w, set, l) => set((l + .02 * w) / 1.02) * 3.5);
  const src = (b) => { const s = AC.createBufferSource(); s.buffer = b; s.loop = true; s.start(0, Math.random() * 3); return s; };
  const gain = v => { const g = AC.createGain(); g.gain.value = v; return g; };
  const filt = (type, f, q = .7) => { const n = AC.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
  const comp = AC.createDynamicsCompressor(), master = gain(.9); master.connect(comp); comp.connect(AC.destination);
  const rumbleF = filt('lowpass', 140), rumble = gain(0); src(brown).connect(rumbleF); rumbleF.connect(rumble); rumble.connect(master);
  const drone = gain(0);
  [38, 57.2, 76.6].forEach((f, i) => { const o = AC.createOscillator(); o.frequency.value = f; o.start(); const g = gain(i ? .35 : 1); o.connect(g); g.connect(drone); });
  drone.connect(master);
  const windF = filt('bandpass', 500, .8), wind = gain(0); src(white).connect(windF); windF.connect(wind); wind.connect(master);
  // 낯선 화음: 살짝 어긋난 톱니파 다섯 개
  const padF = filt('lowpass', 500, 2), pad = gain(0);
  [110, 164.8, 207.7, 220.9, 329.6].forEach(f => { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = (Math.random() - .5) * 18; o.start(); const g = gain(.12); o.connect(g); g.connect(padF); });
  padF.connect(pad); pad.connect(master);
  SND = { master, rumble, rumbleF, drone, wind, windF, pad, padF, white, brown, gain, filt };
}
// 한 바퀴를 채울 때마다 깊게 '둥—' 울린다
function boom(n) {
  shake = Math.min(1, .45 + n * .15);
  if (navigator.vibrate) navigator.vibrate(n >= 3 ? [120, 60, 220] : [70 + n * 20]);
  if (!AC || muted) return;
  const { master, gain, filt, brown } = SND, now = AC.currentTime, big = n >= 3 ? 1.6 : 1;
  const o = AC.createOscillator(), g = gain(0);
  o.frequency.setValueAtTime(95, now); o.frequency.exponentialRampToValueAtTime(32, now + 2.8);
  g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.7 * big, now + .03); g.gain.exponentialRampToValueAtTime(.001, now + 3.4 * big);
  o.connect(g); g.connect(master); o.start(now); o.stop(now + 3.6 * big);
  const s = AC.createBufferSource(), f = filt('lowpass', 260), g2 = gain(0); s.buffer = brown;
  g2.gain.setValueAtTime(.9 * big, now); g2.gain.exponentialRampToValueAtTime(.001, now + 2.2 * big);
  s.connect(f); f.connect(g2); g2.connect(master); s.start(now); s.stop(now + 2.4 * big);
  if (n >= 3) [523.3, 784, 1046.5].forEach((fr, i) => {
    const b = AC.createOscillator(), bg = gain(0); b.frequency.value = fr * (1 + i * .003);
    bg.gain.setValueAtTime(0, now + .05); bg.gain.linearRampToValueAtTime(.06, now + .1); bg.gain.exponentialRampToValueAtTime(.001, now + 5);
    b.connect(bg); bg.connect(master); b.start(now); b.stop(now + 5.2);
  });
}
function soundFrame(P, speed) {
  const turns = Math.floor(spun / 360);
  if (turns > lastTurn) { lastTurn = turns; if (turns <= 7) boom(turns); }
  if (!AC || muted) return;
  const { rumble, rumbleF, drone, wind, windF, pad, padF } = SND, now = AC.currentTime, set = (p, v) => p.setTargetAtTime(v, now, .25);
  set(rumble.gain, .04 + .45 * Math.pow(P, 1.5) + .25 * Q); set(rumbleF.frequency, 110 + 260 * P);
  set(drone.gain, .015 + .22 * P + .15 * Q);
  set(wind.gain, clamp(speed / 6) * .3 * (.4 + .6 * P)); set(windF.frequency, 350 + clamp(speed / 6) * 1400);
  set(pad.gain, .22 * Q); set(padF.frequency, 300 + 900 * Q + 200 * Math.sin(now * .3));
}

/* ───── 배경 연기: 노이즈를 겹겹이 비틀어 말려 오르는 구름 ───── */
const FOG = (() => {
  const c = $('fog'), gl = c.getContext('webgl', { premultipliedAlpha: true, alpha: true });
  if (!gl) return null;
  const vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }';
  const fs = `precision highp float;
uniform vec2 res; uniform float t, I, warm, gr;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p){ float v = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for (int i = 0; i < 6; i++) { v += a * n(p); p = m * p; a *= .5; } return v; }
void main(){
  vec2 uv = (gl_FragCoord.xy - .5 * res) / res.y;
  vec2 p = uv * 1.7 + vec2(0., -t * .035);
  vec2 q = vec2(fbm(p + vec2(0., t * .05)), fbm(p + vec2(5.2, 1.3) - t * .04));
  vec2 r = vec2(fbm(p + 3.6 * q + vec2(1.7, 9.2) + t * .06), fbm(p + 3.6 * q + vec2(8.3, 2.8) - t * .05));
  float f = fbm(p + 3.2 * r);
  float smoke = smoothstep(.3, .78, f) * 1.1 + .6 * pow(max(f - .5, 0.), 1.2);
  float d = length(uv), mask = smoothstep(gr * .8, gr * 1.9, d) * (.6 + .4 * smoothstep(.45, -.5, uv.y)) + .14;
  vec3 col = mix(vec3(.42, .47, .58), vec3(.96, .96, 1.), smoothstep(.55, 1., f));
  col = mix(col, vec3(1., .55, .28), warm * (1. - smoothstep(gr, gr * 2.6, d)) * .7);
  float a = clamp(smoke * mask * I, 0., 1.);
  gl_FragColor = vec4(col * a, a);
}`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = Object.fromEntries(['res', 't', 'I', 'warm', 'gr'].map(k => [k, gl.getUniformLocation(pr, k)]));
  return (t, intensity, warm, globeR) => {
    const w = Math.round(W * .5), h = Math.round(H * .5);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; gl.viewport(0, 0, w, h); }
    gl.uniform2f(U.res, w, h); gl.uniform1f(U.t, t); gl.uniform1f(U.I, intensity); gl.uniform1f(U.warm, warm); gl.uniform1f(U.gr, globeR / H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
})();

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000), t = now / 1000; last = now;
  if (homing) {
    const k = Math.min(1, dt * 2.5), dl = ((-HOME[0] - rot[0]) % 360 + 540) % 360 - 180;
    rot[0] += dl * k; rot[1] += (-HOME[1] - rot[1]) * k; z += (1 - z) * k;
    if (Math.abs(dl) < .05 && Math.abs(z - 1) < .004) { homing = false; z = 1; }
  } else if (!drag) {
    rot[0] += spin[0] * dt * 60; rot[1] = clamp(rot[1] + spin[1] * dt * 60, -88, 88); spun += Math.hypot(spin[0], spin[1]) * dt * 60;
    spin[0] *= Math.pow(.94, dt * 60); spin[1] *= Math.pow(.94, dt * 60);
    idle += dt; if (idle > 4) rot[0] += dt * 2.2 * clamp((idle - 4) / 2);
  }
  Q += (clamp((spun - REVEAL_FROM) / REVEAL_SPAN) - Q) * Math.min(1, dt * 1.5);
  // 용이 드러날수록 지구가 조금 물러나 용이 날 자리를 내준다
  // 세 바퀴까지 긴장이 쌓인다(P), 바퀴를 채울 때마다 크게 흔들린다(shake)
  const P = clamp(spun / REVEAL_FROM), speed = Math.hypot(spin[0], spin[1]);
  soundFrame(P, speed);
  shake *= Math.pow(.25, dt);
  const amp = P * P * 1.8 + Q * 1.2 + shake * 16, sx = (Math.sin(t * 61) + Math.sin(t * 37.3)) * .5 * amp, sy = (Math.cos(t * 53) + Math.sin(t * 29.7)) * .5 * amp;
  const R = BASE * z * (1 - .24 * Q), cx = W / 2 + sx, cy = H / 2 + sy;
  proj.scale(R).translate([cx, cy]).rotate([rot[0], rot[1], 0]);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // 다른 세계의 기운: 지구 뒤로 붉은 빛이 번지고 바깥이 깊어진다
  const glow = .12 * P + .3 * Q + .25 * shake;
  if (glow > .01) {
    const g = ctx.createRadialGradient(cx, cy, R * .9, cx, cy, R * (2.2 + .4 * Math.sin(t * .7)));
    g.addColorStop(0, `rgba(200,90,30,${glow})`); g.addColorStop(.45, `rgba(120,30,15,${glow * .45})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  document.body.style.background = `rgb(${12 + 16 * Q | 0},${11 + 2 * Q | 0},${10 + 2 * Q | 0})`;
  FOG?.(t, .62 + .3 * P + .35 * Q + .25 * shake, Q, R);
  drawGlobe(R, cx, cy, t);
  window.GLOBE = { R, cx, cy, t, W, H, DPR, Q };
  $('coord').textContent = coordText(t);
  $('zoomv').textContent = `${Math.round(z * 100)}%`;
  $('home').classList.toggle('on', d3.geoDistance(proj.invert([cx, cy]), HOME) > .5 || Math.abs(z - 1) > .05 || spun > 30);
  requestAnimationFrame(frame);
}

/* ───── 조작: 끌면 돌고, 핀치·Ctrl휠·버튼으로 확대 ───── */
const zoomBy = f => { z = clamp(z * f, .55, 7); homing = false; };
const pts = new Map();
let pinch = null;
const turn = (dx, dy) => { const k = 57.3 / (BASE * z); rot[0] += dx * k; rot[1] = clamp(rot[1] - dy * k, -88, 88); spun += Math.hypot(dx, dy) * k; };
cv.addEventListener('pointerdown', e => {
  if (!muted) startSound();
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); cv.setPointerCapture(e.pointerId);
  homing = false; spin = [0, 0]; idle = 0;
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); drag = null; }
  else if (pts.size === 1) { drag = { x: e.clientX, y: e.clientY, t: performance.now() }; cv.classList.add('drag'); }
});
cv.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); idle = 0;
  if (pinch && pts.size >= 2) { const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y); zoomBy(d / pinch); pinch = d; return; }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, now = performance.now(), k = Math.max(1, now - drag.t) / 16.7;
  turn(dx, dy); const s = 57.3 / (BASE * z); spin = [dx * s / k, -dy * s / k];
  drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
  if (!moved) { moved = true; $('hint').style.opacity = 0; }
});
const up = e => {
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  if (!drag) return;
  if (performance.now() - drag.t > 80) spin = [0, 0];
  drag = null; cv.classList.remove('drag');
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => {
  e.preventDefault(); homing = false; idle = 0;
  if (e.ctrlKey || e.metaKey) zoomBy(Math.exp(clamp(-e.deltaY * .012, -.25, .25)));
  else turn(-e.deltaX, -e.deltaY);
}, { passive: false });
let gz = 1;
cv.addEventListener('gesturestart', e => { e.preventDefault(); gz = z; });
cv.addEventListener('gesturechange', e => { e.preventDefault(); z = clamp(gz * e.scale, .55, 7); });
addEventListener('keydown', e => {
  const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (k) { homing = false; idle = 0; spin = [k[0] * -1.2 / z, k[1] * 1.2 / z]; }
  if (e.key === '+' || e.key === '=') zoomBy(1.25);
  if (e.key === '-' || e.key === '_') zoomBy(.8);
});
$('snd').onclick = () => {
  muted = !muted; $('snd').style.opacity = muted ? .35 : 1;
  if (muted) AC?.suspend(); else { startSound(); AC.resume(); }
};
$('zin').onclick = () => zoomBy(1.4);
$('zout').onclick = () => zoomBy(1 / 1.4);
$('home').onclick = () => { homing = true; spin = [0, 0]; idle = 0; spun = 0; lastTurn = 0; shake = 0; };
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
Promise.all([document.fonts.load(`900 20px 'Noto Serif KR'`, '여기서부터는용이산다'), document.fonts.load(`500 20px 'Noto Serif KR'`, '바다')]).catch(() => {}).then(() => { for (const k in LAYERS) delete LAYERS[k]; });
loadWorld().catch(e => console.warn('세계 지도 데이터를 불러오지 못했어요', e));
</script>
