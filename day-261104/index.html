<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유통기한 · 배양 접시</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  #track { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
  #track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100vw; height: 100%; display: grid; place-items: center; scroll-snap-align: center; }
  .slide canvas { touch-action: none; cursor: crosshair; display: block; }
  .back { position: fixed; left: 18px; top: 14px; z-index: 2; color: #aaa; font: 13px/1 system-ui, sans-serif; text-decoration: none; }
  .nav { position: fixed; top: 50%; z-index: 2; transform: translateY(-50%); padding: 18px; border: 0; background: none; color: #c4c4c4; font-size: 26px; cursor: pointer; }
  .nav:hover { color: #555; }
  #prev { left: 4px; } #next { right: 4px; }
  #dots { position: fixed; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; gap: 9px; }
  #dots i { width: 6px; height: 6px; border-radius: 50%; background: #e2e2e2; transition: background .3s; }
  #dots i.on { background: #777; }
  .pill { border: 1px solid rgba(0,0,0,.14); border-radius: 999px; background: rgba(255,255,255,.7); color: #333; font: 500 13px/1 system-ui, sans-serif; padding: 11px 20px; cursor: pointer; backdrop-filter: blur(6px); }
  .pill:hover { background: rgba(0,0,0,.05); }
  .pill:disabled { opacity: .35; cursor: default; }
  #submit { position: fixed; left: 50%; bottom: 46px; z-index: 3; transform: translateX(-50%); }
  #toGallery { position: fixed; right: 16px; top: 10px; z-index: 3; padding: 9px 14px; font-size: 12px; }
  #gallery { position: fixed; inset: 0; z-index: 5; overflow-y: auto; background: #fff; }
  #gallery[hidden] { display: none; }
  #gallery header { background: linear-gradient(#fff 60%, rgba(255,255,255,0));
    position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
  #gcount { color: #999; font: 12px/1 ui-monospace, monospace; }
  #wall { position: relative; margin: 8px auto 60px; }
  #wall img { position: absolute; border-radius: 50%; transition: transform .35s; }
  #wall img:hover { transform: scale(1.06); z-index: 1; }
  #wall img.mine { animation: pop .9s ease-out both; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  #wall img { cursor: zoom-in; }
  #zoom { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(255,255,255,.94); cursor: zoom-out; opacity: 0; transition: opacity .3s; }
  #zoom[hidden] { display: none; }
  #zoom.on { opacity: 1; }
  #zoom img { width: min(92vw, 92vh); height: min(92vw, 92vh); transform: scale(.6); transition: transform .4s cubic-bezier(.2,.9,.3,1.2); }
  #zoom.on img { transform: none; }
  #zoom p { position: fixed; bottom: 18px; margin: 0; color: #999; font: 12px/1 ui-monospace, monospace; }
  #gmsg { color: #999; font: 13px/1.6 system-ui, sans-serif; text-align: center; padding-top: 30vh; }
</style>
</head>
<body>
<a class="back" href="../index.html">←</a>
<div id="track"></div>
<button class="nav" id="prev" aria-label="이전 접시">‹</button>
<button class="nav" id="next" aria-label="다음 접시">›</button>
<div id="dots"></div>
<button class="pill" id="submit" disabled>배양 완료 · 제출하기</button>
<button class="pill" id="toGallery">갤러리</button>
<section id="gallery" hidden>
  <header><button class="pill" id="again">← 다시 배양하기</button><span id="gcount"></span></header>
  <div id="wall"></div>
</section>
<div id="zoom" hidden><img alt="크게 본 배양 접시"><p></p></div>
<script>
const COMMON = `
precision highp float;
varying vec2 vUv;
const float TAU = 6.2831853;
float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), u.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), u.x), u.y);
}
float fbm(vec2 p) { float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * noise(p); p = p * 2.02 + vec2(13.7, 7.3); a *= .5; } return s / .97; }
// 각도 방향으로 이음매 없이 반복되는 노이즈 (방사형 균사 결)
float pnoise(vec2 p, float per) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  float i0 = mod(i.x, per), i1 = mod(i.x + 1., per);
  return mix(mix(hash(vec2(i0, i.y)), hash(vec2(i1, i.y)), u.x), mix(hash(vec2(i0, i.y + 1.)), hash(vec2(i1, i.y + 1.)), u.x), u.y);
}
`;

// 군락 하나: 높이맵 → 법선 → 조명. 파라미터로 곰팡이·세균·거품·색소를 모두 만든다
const COLONY_FS = COMMON + `
uniform vec2 uSeed;
uniform float uSector, uBands;
uniform float uPx, uR, uAge, uLobe, uLobeF, uHeight, uProf, uFuzz, uGloss, uRadial, uRings, uRingF, uWrinkle, uSpeck, uHalo, uHaloR, uTrans, uVelvet, uFront, uBody, uBubble;
uniform vec3 uC0, uC1, uC2, uC3, uCs;
uniform vec3 uB[16];
uniform int uBN;

float edgeR(vec2 p) {
  float th = atan(p.y, p.x); vec2 dir = vec2(cos(th), sin(th));
  return uR * (1. + uLobe * ((fbm(dir * uLobeF + uSeed) - .5) * 1.8 + (noise(dir * uLobeF * 5. + uSeed.yx) - .5) * .35));
}
vec2 shape(vec2 p) {
  if (uBN > 0) {
    float d = 9., h = 0.;
    for (int i = 0; i < 16; i++) {
      if (i >= uBN) break;
      vec3 b = uB[i];
      float di = length(p - b.xy) / b.z;
      d = min(d, di);
      h = max(h, uHeight * (b.z / uR) * pow(max(0., 1. - di * di), uProf));
    }
    return vec2(d, h);
  }
  float d = length(p) / edgeR(p), x = min(d, 1.);
  return vec2(d, uHeight * pow(max(0., 1. - x * x), uProf));
}
float detailH(vec2 p, float d) {
  float x = min(d, 1.), r = length(p), a = atan(p.y, p.x) / TAU + .5, h = 0.;
  h += uRadial * .05 * (pnoise(vec2(a * 64., r * 4. + uSeed.x), 64.) - .5) * smoothstep(1., .15, x);
  h += uRadial * .03 * (pnoise(vec2(a * 160., r * 9. + uSeed.y), 160.) - .5) * smoothstep(1., .3, x);
  h += uRings * .014 * sin(x * uRingF * TAU + fbm(p * 5. + uSeed) * 2.5) * smoothstep(1., .85, x);
  float w = 1. - abs(fbm(p * 6. + uSeed + vec2(fbm(p * 2.5 + uSeed.yx)) * 1.6) * 2. - 1.);
  h += uWrinkle * .09 * pow(w, 2.5) * smoothstep(1., .25, x);
  h += uVelvet * .012 * fbm(p * uPx * .08 + uSeed);
  return h * step(d, 1.2);
}
float Hf(vec2 p) { vec2 s = shape(p); return s.y + detailH(p, s.x); }

void main() {
  vec2 p = vUv * 2. - 1.;
  vec2 s = shape(p);
  float d = s.x, x = min(d, 1.), e = 2. / uPx;
  float det = detailH(p, d);
  float h0 = s.y + det, hx = Hf(p + vec2(e, 0.)), hy = Hf(p + vec2(0., e));
  vec3 n = normalize(vec3(-(hx - h0) / e, -(hy - h0) / e, 1.));
  float r = length(p), a = atan(p.y, p.x) / TAU + .5;

  // 가장자리: 털 같은 균사는 반쯤 비치고, 세균은 매끈하게 끊긴다
  float per = floor(uPx * 1.1);
  float fib = pnoise(vec2(a * per, r * uPx * .07 + uSeed.x), per);
  float fib2 = pnoise(vec2(a * floor(per * .5), r * uPx * .008 + uSeed.y), floor(per * .5));
  float aa = e * 1.5 / max(uR, .05);
  float hard = 1. - smoothstep(1. - aa, 1. + aa, d);
  float soft = 1. - smoothstep(1. - .45 * uFuzz, 1. + .06 * uFuzz, d + (fib - .5) * .18 * uFuzz + (fib2 - .5) * .22 * uFuzz);
  float alpha = mix(hard, soft, step(.01, uFuzz));
  alpha *= mix(1., .5 + .5 * fib, uFuzz * smoothstep(.78, 1., d));
  float hairs = smoothstep(.8, .97, fib) * (1. - smoothstep(1., 1.08, d)) * step(1., d) * uFuzz;
  alpha = max(alpha, hairs * .25) * uBody;

  // 색: 가운데부터 포자색이 올라오고, 부채꼴 얼룩과 하루치 성장 띠가 생긴다
  float front = uFront * (.3 + .7 * uAge);
  float spor = 1. - smoothstep(front - .2, front + .12, x + (fbm(p * 7. + uSeed) - .5) * .22);
  vec3 body = mix(uC0, uC1, smoothstep(0., max(front, .05), x));
  float sec = pnoise(vec2(a * 7., uSeed.x), 7.) * .6 + pnoise(vec2(a * 19., uSeed.y), 19.) * .4;
  body *= 1. + uSector * (sec - .5) * .5;
  vec3 col = mix(uC2, body, spor);
  col *= 1. - uBands * .09 * smoothstep(.2, .8, sin(x * 15. + fbm(p * 4. + uSeed) * 3.)) * step(x, .97);
  col *= 1. + uRings * .14 * sin(x * uRingF * TAU + fbm(p * 5. + uSeed) * 2.5);
  float sp = smoothstep(.62, .8, noise(p * uPx * .09 + uSeed)) * smoothstep(.4, .9, noise(p * uPx * .02 + uSeed.yx));
  col = mix(col, uCs, clamp(sp * uSpeck * 1.6, 0., 1.) * spor);
  col *= 1. + uVelvet * (.22 * (fbm(p * uPx * .05 + uSeed * 3.) - .5) + .14 * (noise(p * uPx * .4 + uSeed) - .5));
  col *= clamp(1. + det * 7., .55, 1.15);

  // 조명: 부드러운 확산광 + 젖은 표면엔 창문 모양 반사
  vec3 L = normalize(vec3(-.5, .55, .75));
  float nl = dot(n, L);
  float lam = mix(clamp(nl, 0., 1.), .5 + .5 * nl, .5 + uFuzz * .4);
  vec3 rf = reflect(vec3(0., 0., -1.), n);
  float win = smoothstep(.12, 0., abs(rf.x + .42) - .16) * smoothstep(.12, 0., abs(rf.y - .45) - .2);
  float env = win * 1.1 + smoothstep(-.2, .9, rf.y) * .18;
  float fres = .04 + .96 * pow(1. - clamp(n.z, 0., 1.), 4.);
  float spec = env * mix(.15, 1., fres) * uGloss + pow(clamp(dot(n, normalize(L + vec3(0., 0., 1.))), 0., 1.), 160.) * uGloss * .8;
  float th = clamp(s.y / max(uHeight, .001), 0., 1.);
  col *= 1. + uTrans * .25 * th;
  col *= 1. - uGloss * .3 * smoothstep(.82, .99, x) * (1. - uFuzz);
  vec3 lit = col * (.5 + .62 * lam) + spec * vec3(.95, .97, 1.);
  lit = mix(lit, uC2 * 1.04, uFuzz * .45 * smoothstep(.85, 1.05, d));
  lit = min(lit, vec3(1.));

  alpha *= mix(1., .4 + .6 * smoothstep(0., .5, th), uTrans);
  alpha *= mix(1., .1 + .9 * smoothstep(.55, 1., x) + spec, uBubble);
  alpha = clamp(alpha, 0., 1.);

  float ds = shape(p - vec2(.03, -.045) * uHeight * 6.).x;
  float shA = (1. - smoothstep(.75, 1.3, ds)) * .28 * clamp(uHeight * 7., 0., 1.) * uBody;
  float haloA = uHalo * (1. - smoothstep(.95, uHaloR + .25 * (fbm(p * 3. + uSeed) - .5), d)) * (.45 + .6 * fbm(p * 4. + uSeed.yx));
  haloA = clamp(haloA, 0., 1.) * .7;

  vec4 o = vec4(0., 0., 0., shA);
  o = vec4(uC3 * haloA, haloA) + o * (1. - haloA);
  o = vec4(lit * alpha, alpha) + o * (1. - alpha);
  gl_FragColor = o;
}
`;

// 접시 바닥: 그림자와 커스틱, 배지, 두꺼운 유리벽(배지를 굴절시켜 비추고 바깥으로 갈수록 반사가 세진다)
const DISH_FS = COMMON + `
uniform vec3 uA, uBc, uT1, uT2;
uniform vec2 uSeed;
uniform float uPx;
const float RIN = .935;
vec3 agarCol(vec2 p) {
  vec3 ag = mix(uA, uBc, smoothstep(0., 1.2, length(p - vec2(-.25, .3))));
  ag = mix(ag, uT1, smoothstep(.5, .78, fbm(p * 1.7 + uSeed)) * .6);
  ag = mix(ag, uT2, smoothstep(.55, .82, fbm(p * 2.4 + uSeed * 1.9)) * .5);
  return ag * (.95 + .1 * fbm(p * 30. + uSeed));
}
void main() {
  vec2 p = (vUv * 2. - 1.) * 1.12;
  float r = length(p), px = 2.24 / uPx, th = atan(p.y, p.x);
  float lightA = .35 + .65 * pow(max(0., cos(th - 2.35)), 2.) + .35 * pow(max(0., cos(th + .8)), 4.);

  vec2 Ld = normalize(vec2(-.5, .55)), dir = p / max(r, 1e-4);
  vec2 sp = p - vec2(.045, -.07);
  float sr = length(sp);
  vec4 o = vec4(0., 0., 0., (1. - smoothstep(.82, 1.2, sr)) * .3);
  float ca = exp(-pow((sr - .97) / .06, 2.)) * .13 * max(0., dot(sp / max(sr, 1e-4), -Ld)) * step(1., r);
  o = vec4(mix(uA, vec3(1.), .5) * ca, ca) + o * (1. - ca);

  float disk = 1. - smoothstep(1. - px, 1. + px, r);
  vec3 ag = agarCol(p) * (.97 + .06 * noise(p * uPx * .25));
  float m = smoothstep(RIN - .08, RIN, r);
  ag = mix(ag, ag * .6, m * .65);
  ag += vec3(.16) * exp(-pow((r - (RIN - .005)) / .003, 2.)) * lightA;
  float edge = max(0., RIN - r);
  ag *= 1. - .38 * exp(-edge / .045) * max(0., dot(dir, Ld));
  ag += agarCol(p) * .3 * exp(-edge / .03) * max(0., -dot(dir, Ld));
  ag *= 1. - .06 * exp(-pow((r - .82) / .006, 2.));
  ag += vec3(.035) * exp(-pow((r - .812) / .004, 2.)) * lightA;
  ag *= .94 + .1 * dot(p, Ld);
  vec2 cell = floor(p * 90.), f = fract(p * 90.) - .5;
  float hh = hash(cell + uSeed);
  float part = step(.97, hh) * (1. - smoothstep(.05, .14, length(f - (vec2(hash(cell + 1.7), hash(cell + 3.1)) - .5) * .6)));
  ag = mix(ag, ag * (hh > .988 ? 1.3 : .72), part * .6);

  float wt = clamp((r - RIN) / (1. - RIN), 0., 1.);
  vec2 q = p / max(r, 1e-4) * (RIN - .03 - wt * .14);
  vec3 wall = agarCol(q) * .55 + vec3(.86, .89, .93) * .4;
  float u = wt * 2. - 1.;
  vec3 tn = normalize(vec3(dir * u, sqrt(max(0., 1. - u * u)) * .8 + .05));
  vec3 L3 = normalize(vec3(Ld * .8, .6));
  float wd = clamp(dot(tn, L3), 0., 1.);
  float ws = pow(clamp(dot(reflect(-L3, tn), vec3(0., 0., 1.)), 0., 1.), 70.);
  float wf = pow(1. - tn.z, 2.);
  wall = mix(wall, vec3(.93, .95, .98), .2 + .35 * wf);
  wall *= .5 + .6 * wd;
  wall += vec3(.95, .97, 1.) * (ws * 1.1 + wf * .18);
  wall += vec3(.92, .96, 1.) * exp(-pow((r - .997) / .0025, 2.)) * (.25 + .6 * lightA);
  wall += vec3(.92, .96, 1.) * exp(-pow((r - (RIN + .003)) / .002, 2.)) * (.15 + .45 * lightA);
  float agar = 1. - smoothstep(RIN - px, RIN + px, r);
  o = vec4(mix(wall, ag, agar), 1.) * disk + o * (1. - disk);
  gl_FragColor = o;
}
`;

// 뚜껑: 살짝 어긋난 테두리 띠, 짧고 날카로운 반사, 넓은 창문 반사, 김 서린 물방울, 그레인
const LID_FS = COMMON + `
uniform vec2 uSeed;
uniform float uPx, uFog;
vec4 drops(vec2 p, float k, float sc, vec2 seed, float rl) {
  float zone = smoothstep(.74, .9, rl) * (1. - smoothstep(.94, .955, rl));
  float mask = (smoothstep(.45, .65, fbm(p * 3. + seed)) + .25) * uFog;
  vec2 g = p * sc, c = floor(g), f = fract(g);
  float hh = hash(c + seed);
  vec2 ctr = vec2(hash(c + 5.1), hash(c + 9.7)) * .6 + .2;
  float rad = .12 + .3 * hash(c + 2.3), dd = length(f - ctr) / rad;
  float on = step(1. - mask * zone * k, hh) * step(dd, 1.);
  float da = on * smoothstep(.55, 1., dd) * .3;
  float ha = on * (1. - smoothstep(0., .3, length(f - ctr - vec2(-.3, .3) * rad))) * .3;
  return vec4(da, ha, 0., 0.);
}
void main() {
  vec2 p = (vUv * 2. - 1.) * 1.12;
  vec2 q = p - vec2(-.014, .018);
  float rl = length(q), th = atan(q.y, q.x), px = 2.24 / uPx;
  vec2 Ld = normalize(vec2(-.5, .55)), dir = q / max(rl, 1e-4);
  float lightA = .3 + .7 * pow(max(0., cos(th - 2.35)), 2.) + .4 * pow(max(0., cos(th + .8)), 4.);
  float inLid = 1. - smoothstep(1.012 - px, 1.012 + px, rl);
  float lu = clamp((rl - .972) / .04, 0., 1.) * 2. - 1.;
  vec3 tn = normalize(vec3(dir * lu, sqrt(max(0., 1. - lu * lu)) * .8 + .05));
  float ls = pow(clamp(dot(reflect(-normalize(vec3(Ld * .8, .6)), tn), vec3(0., 0., 1.)), 0., 1.), 90.);
  float band = smoothstep(.968, .976, rl) * inLid;
  float a = band * (.05 + .1 * lightA + ls * .8 + pow(1. - tn.z, 2.) * .2);
  float arc1 = pow(max(0., cos(th - 2.25)), 40.), arc2 = pow(max(0., cos(th + .85)), 60.);
  a += (arc1 * .85 + arc2 * .5) * exp(-pow((rl - .99) / .005, 2.));
  a += arc1 * .5 * exp(-pow((rl - .962) / .003, 2.));
  a += .45 * lightA * exp(-pow((rl - 1.01) / .0018, 2.));
  a += .22 * lightA * exp(-pow((rl - .97) / .002, 2.));
  vec2 w = p * mat2(.8, -.6, .6, .8);
  a += smoothstep(0., .06, w.y - .52) * smoothstep(0., .05, .72 - w.y) * smoothstep(0., .15, .5 - abs(w.x)) * .06 * inLid;
  a += (1. - smoothstep(0., 1.2, length(p - vec2(-.45, .5)))) * .06 * inLid;
  a += exp(-pow((rl - .9) / .012, 2.)) * pow(max(0., cos(th - 2.4)), 8.) * .12;
  vec4 o = vec4(vec3(a), a);
  vec4 d1 = drops(p, .45, 70., uSeed, rl), d2 = drops(p, .25, 32., uSeed + 7., rl);
  float da = max(d1.x, d2.x), ha = max(d1.y, d2.y);
  o = vec4(vec3(.05, .08, .12) * da, da) + o * (1. - da);
  o = vec4(vec3(ha), ha) + o * (1. - ha);
  float vig = smoothstep(.5, 1., length(p)) * .2 * inLid;
  o = vec4(0., 0., 0., vig) + o * (1. - vig);
  float gr = hash(floor(vUv * uPx) + uSeed) - .5, ga = abs(gr) * .07 * inLid;
  o = vec4((gr > 0. ? vec3(1.) : vec3(0.)) * ga, ga) + o * (1. - ga);
  float dust = step(.9975, hash(floor(p * 140.) + uSeed + 3.)) * inLid * .12;
  o = vec4(vec3(dust), dust) + o * (1. - dust);
  gl_FragColor = o;
}
`;

const DPR = Math.min(2, devicePixelRatio || 1), TAU = Math.PI * 2;
const rnd = Math.random, rr = (a, b) => a + rnd() * (b - a), pick = a => a[rnd() * a.length | 0];
const ease = t => 1 - Math.pow(1 - t, 3);
const hsl = (h, s, l) => {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)));
};
const fitD = () => Math.max(320, Math.min(innerWidth * 0.86, innerHeight * 0.84));
const S = Math.round(fitD() * DPR);

// 셰이더는 화면 밖 WebGL 캔버스 하나에서 돌리고, 결과를 2D 캔버스로 옮겨 쌓는다
const glc = document.createElement('canvas');
glc.width = glc.height = S;
const gl = glc.getContext('webgl', { premultipliedAlpha: true, preserveDrawingBuffer: true });
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
function program(fs) {
  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);

    return s;

  gl.attachShader(p, sh(gl.VERTEX_SHADER, 'attribute vec2 a; varying vec2 vUv; void main(){ vUv = a * .5 + .5; gl_Position = vec4(a, 0., 1.); }'));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const locs = {};
  return { p, a: gl.getAttribLocation(p, 'a'), loc: n => (n in locs ? locs[n] : (locs[n] = gl.getUniformLocation(p, n))) };

const PR = { colony: program(COLONY_FS), dish: program(DISH_FS), lid: program(LID_FS) };
function shade(pr, w, U, target) {
  gl.useProgram(pr.p);
  gl.enableVertexAttribArray(pr.a);
  gl.vertexAttribPointer(pr.a, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0, 0, w, w);
  for (const [k, v] of Object.entries(U)) {
    const l = pr.loc(k);
    if (l === null) continue;
    if (k === 'uBN') gl.uniform1i(l, v);
    else if (k === 'uB') gl.uniform3fv(l, v);
    else if (typeof v === 'number') gl.uniform1f(l, v);
    else if (v.length === 2) gl.uniform2fv(l, v);
    else gl.uniform3fv(l, v);

  target.clearRect(0, 0, w, w);
  target.drawImage(glc, 0, S - w, w, w, 0, 0, w, w);
}

class Colony {
  constructor(type, x, y, Rpx, dur, o = {}) {
    this.P = { ...BASE, ...TYPES[type](o) };
    if (o.agar) for (const k of ['c0', 'c1', 'c2']) this.P[k] = this.P[k].map((v, i) => v * .86 + o.agar[i] * .14);
    if (!this.P.halo && this.P.body && rnd() < .35)
      Object.assign(this.P, { halo: rr(.25, .5), haloR: rr(1.3, 1.8), c3: pick([o.agar ? o.agar.map(v => v * .5) : hsl(0, 0, 20), hsl(52, 90, 60), hsl(290, 45, 35), hsl(20, 80, 45)]) });
    this.half = Math.min(S / 2, Math.ceil(Rpx / (this.P.beads ? .62 : this.P.R)));
    this.w = this.half * 2;
    this.cv = document.createElement('canvas');
    this.cv.width = this.cv.height = this.w;
    this.ctx = this.cv.getContext('2d');
    Object.assign(this, { x, y, dur, t0: performance.now(), seed: [rr(0, 100), rr(0, 100)], phase: rnd() * 3 | 0, drawn: false });

      uFront: P.front, uSector: P.sector, uBands: P.bands, uBody: P.body, uBubble: P.bubble, uC0: P.c0, uC1: P.c1, uC2: P.c2, uC3: P.c3, uCs: P.cs, uBN: 0 };
    if (P.beads) {

class Dish {
  constructor(m) {
    Object.assign(this, { m, c: S / 2, R: S / 2 / 1.12, growing: [], dirty: true, stroke: null });
    this.Rin = this.R * .935;
    const mk = () => { const c = document.createElement('canvas'); c.width = c.height = S; return c; };
    this.cv = mk(); this.ctx = this.cv.getContext('2d');
    this.settled = mk(); this.sctx = this.settled.getContext('2d');
    this.glass = mk();
    shade(PR.dish, S, { uA: m.a, uBc: m.b, uT1: m.t1, uT2: m.t2, uSeed: [rr(0, 50), rr(0, 50)], uPx: S }, this.sctx);
    shade(PR.lid, S, { uSeed: [rr(0, 50), rr(0, 50)], uPx: S, uFog: m.fog }, this.glass.getContext('2d'));
  }
  inside(x, y) { return Math.hypot(x - this.c, y - this.c) < this.Rin * .96; }
  spawn(type, x, y, Rpx, dur, o) {
    if (this.growing.length > 60) return;
    this.count = (this.count || 0) + 1;
    document.getElementById('submit').disabled = false;
    this.growing.push(new Colony(type, x, y, Rpx, dur, { agar: this.m.a, ...o }));
  }
  clip(g) { g.beginPath(); g.arc(this.c, this.c, this.Rin, 0, TAU); g.clip(); }
  render(now, frameNo) {
    if (!this.dirty && !this.growing.length) return;
    this.dirty = false;
    const g = this.ctx, every = this.growing.length > 16 ? 3 : 1;
    g.clearRect(0, 0, S, S);
    g.drawImage(this.settled, 0, 0);
    g.save(); this.clip(g);
    this.growing = this.growing.filter(k => {
      const p = Math.min(1, (now - k.t0) / k.dur);
      if (p >= 1) {
        k.render(1);
        g.drawImage(k.cv, k.x - k.half, k.y - k.half);
        this.sctx.save(); this.clip(this.sctx); this.sctx.drawImage(k.cv, k.x - k.half, k.y - k.half); this.sctx.restore();
        return false;
      }
      if (!k.drawn || frameNo % every === k.phase % every) { k.render(ease(p)); k.drawn = true; }
      g.drawImage(k.cv, k.x - k.half, k.y - k.half);
      return true;
    });
    g.restore();
    g.drawImage(this.glass, 0, 0);
  }
}

const track = document.getElementById('track'), dotsEl = document.getElementById('dots');
const dishes = [...MEDIA].sort(() => rnd() - .5).slice(0, 3).map(m => new Dish(m));

dishes.forEach(d => {
  const slide = document.createElement('div');
  slide.className = 'slide'; slide.appendChild(d.cv); track.appendChild(slide);
  dotsEl.appendChild(document.createElement('i'));
  const pos = e => { const b = d.cv.getBoundingClientRect(); return [(e.clientX - b.left) * S / b.width, (e.clientY - b.top) * S / b.height]; };
  d.cv.addEventListener('pointerdown', e => {
    const [x, y] = pos(e);
    if (!d.inside(x, y)) return;
    try { d.cv.setPointerCapture(e.pointerId); } catch {}
    d.stroke = { x, y, sx: x, sy: y, moved: 0, acc: 0, type: pick(STREAK), o: { color: glossyColor() }, gap: d.R * rr(.05, .08) };
  });
  d.cv.addEventListener('pointermove', e => {
    const st = d.stroke;
    if (!st) return;
    const [x, y] = pos(e), step = Math.hypot(x - st.x, y - st.y);
    st.moved += step; st.acc += step; st.x = x; st.y = y;
    if (st.acc < st.gap || !d.inside(x, y)) return;
    st.acc = 0;
    const j = d.R * .03;
    d.spawn(st.type, x + rr(-j, j), y + rr(-j, j), d.R * rr(.02, .055), rr(1200, 2600), st.o);
  });
  const end = () => {
    const st = d.stroke;
    d.stroke = null;
    if (!st || st.moved > 8 * DPR) return;
    const type = weighted(BIG), big = type === 'stain' ? rr(.18, .32) : rr(.08, .22);
    d.spawn(type, st.sx, st.sy, d.R * big, type === 'stain' ? rr(5000, 8000) : rr(3000, 6000), {});
    for (let i = 2 + rnd() * 8 | 0; i > 0; i--) {
      const t = rr(0, TAU), dd = d.R * big * rr(1.2, 1.9), x = st.sx + Math.cos(t) * dd, y = st.sy + Math.sin(t) * dd;
      if (d.inside(x, y)) d.spawn(pick(['glossy', 'beads', 'yeast']), x, y, d.R * rr(.02, .05), rr(2500, 5000), {});
    }
  };
  d.cv.addEventListener('pointerup', end);
  d.cv.addEventListener('pointercancel', end);
});

const current = () => Math.round(track.scrollLeft / innerWidth);
// 스냅이 부드러운 스크롤을 끊는 브라우저가 있어 직접 움직인다
const go = i => {
  const from = track.scrollLeft, to = Math.max(0, Math.min(dishes.length - 1, i)) * innerWidth, t0 = performance.now();
  track.style.scrollSnapType = 'none';
  const step = now => {
    const p = Math.min(1, (now - t0) / 550);
    track.scrollLeft = from + (to - from) * (p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
    if (p < 1) requestAnimationFrame(step); else track.style.scrollSnapType = '';
  };
  requestAnimationFrame(step);
};
document.getElementById('prev').onclick = () => go(current() - 1);
document.getElementById('next').onclick = () => go(current() + 1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(current() + 1); if (e.key === 'ArrowLeft') go(current() - 1); });

let frameNo = 0;
function frame(now) {
  frameNo++;
  const i = current();
  [...dotsEl.children].forEach((el, k) => el.classList.toggle('on', k === i));
  for (let k = Math.max(0, i - 1); k <= Math.min(dishes.length - 1, i + 1); k++) dishes[k].render(now, frameNo);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 크기가 제각각인 접시를 위에서부터 빈자리에 채워 넣는다
let mine = new Set();
function pack(items, W) {
  const placed = [];
  let lastY = 0;
  for (const it of items) {
    // 작은 접시가 많고 큰 접시는 가끔. 작은 접시는 큰 접시 사이 틈을 메운다
    const f = mine.has(it.id) ? rr(.3, .4) : .025 + .38 * Math.pow(rnd(), 3.2);
    const s = Math.max(26, Math.min(W * f, 560)), r = s / 2 / 1.12;
    for (let y = Math.max(r, lastY - 900); ; y += 6) {
      let x = null;
      for (let t = 0; t < 40 && x === null; t++) {
        const cx = rr(r, W - r);
        if (placed.every(p => Math.hypot(p.x - cx, p.y - y) > p.r + r + 3)) x = cx;
      }
      if (x !== null) { placed.push({ ...it, x, y, r, s }); lastY = y; break; }
    }
  }
  return placed;
}
const gallery = document.getElementById('gallery'), wall = document.getElementById('wall'), gcount = document.getElementById('gcount');
async function openGallery() {
  gallery.hidden = false;
  wall.innerHTML = '<p id="gmsg">접시를 모으는 중…</p>';
  let list;
  try { list = await store.list(); } catch (e) { wall.innerHTML = `<p id="gmsg">갤러리를 불러오지 못했어요 (${e.message})</p>`; return; }
  gcount.textContent = `${list.length} plates`;
  if (!list.length) { wall.innerHTML = '<p id="gmsg">아직 제출된 접시가 없어요</p>'; return; }
  const W = Math.min(innerWidth - 32, 1400), placed = pack(list, W);
  wall.innerHTML = '';
  wall.style.width = W + 'px';
  wall.style.height = Math.max(...placed.map(p => p.y + p.r)) + 40 + 'px';
  placed.forEach((p, i) => {
    const im = new Image();
    im.src = p.img; im.alt = '배양 접시'; im.title = new Date(p.created_at).toLocaleDateString('ko-KR');
    Object.assign(im.style, { left: p.x - p.s / 2 + 'px', top: p.y - p.s / 2 + 'px', width: p.s + 'px', height: p.s + 'px' });
    if (mine.has(p.id)) { im.className = 'mine'; im.style.animationDelay = i * .15 + 's'; }
    im.onclick = () => openZoom(placed, i);
    wall.appendChild(im);
  });
}
// 접시를 누르면 크게. 화살표로 앞뒤, 아무 데나 누르거나 Esc로 닫기
const zoom = document.getElementById('zoom'), zimg = zoom.querySelector('img'), zcap = zoom.querySelector('p');
let zlist = [], zi = 0;
function showZoom() {
  const p = zlist[zi];
  zimg.src = p.img;
  zcap.textContent = `${zi + 1} / ${zlist.length} · ${new Date(p.created_at).toLocaleDateString('ko-KR')}`;
}
function openZoom(list, i) {
  zlist = list; zi = i; showZoom();
  zoom.hidden = false;
  requestAnimationFrame(() => zoom.classList.add('on'));
}
function closeZoom() { zoom.classList.remove('on'); setTimeout(() => { zoom.hidden = true; }, 300); }
zoom.onclick = closeZoom;
addEventListener('keydown', e => {
  if (zoom.hidden) return;
  if (e.key === 'Escape') closeZoom();
  if (e.key === 'ArrowRight') { zi = (zi + 1) % zlist.length; showZoom(); }
  if (e.key === 'ArrowLeft') { zi = (zi - 1 + zlist.length) % zlist.length; showZoom(); }
});
const submitBtn = document.getElementById('submit');
let submitted = false;
submitBtn.onclick = async () => {
  const used = dishes.filter(d => d.count);
  if (!used.length) return;
  submitBtn.disabled = true; submitBtn.textContent = '제출 중…';
  try {
    mine = new Set(await store.add(used.map(snapshot)));
    submitted = true;
    submitBtn.textContent = '제출 완료';
    await openGallery();
  } catch (e) {
    submitBtn.disabled = false; submitBtn.textContent = `제출 실패 (${e.message}) · 다시 시도`;
  }
};
document.getElementById('toGallery').onclick = openGallery;
document.getElementById('again').onclick = () => { if (submitted) location.reload(); else gallery.hidden = true; };
</script>
