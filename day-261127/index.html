<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 261127 — 마감직전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;600;900&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Noto Sans KR', sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #top { position: fixed; right: 18px; top: 14px; font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; z-index: 6; }
  #top a { color: rgba(255,240,220,.75); text-decoration: none; }
  #ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 5; background: rgba(6,5,4,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #ov.res { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; justify-content: flex-end; padding-bottom: 12vh; box-sizing: border-box; pointer-events: none; }
  #ov button { pointer-events: auto; background: #ff4a2e; color: #fff; border: 0; padding: 22px 56px; font: 900 22px 'Noto Sans KR', sans-serif; letter-spacing: .04em; cursor: pointer; border-radius: 6px; box-shadow: 0 10px 30px rgba(255,60,30,.35), 0 0 0 1px rgba(255,255,255,.15) inset; }
  #ov button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  #ov .sub { display: none; }
  #ov.hide { display: none; }

  #hud { position: fixed; left: 20px; top: 20px; width: 340px; z-index: 6; color: #fff; background: rgba(16,15,14,.92); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.55); overflow: hidden; font-family: 'Noto Sans KR', sans-serif; }
  #hud .h { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 12px; }
  #hud .h span { font-size: 17px; font-weight: 900; letter-spacing: -.01em; }
  #hud .h b { font: 700 14px 'IBM Plex Mono', monospace; background: #ff5a36; color: #fff; padding: 4px 10px; border-radius: 999px; }
  #hud .time { display: flex; align-items: center; gap: 10px; padding: 0 20px 16px; font: 600 12px 'IBM Plex Mono', 'Noto Sans KR', monospace; color: rgba(255,255,255,.7); }
  #hud .time em { font-style: normal; min-width: 44px; text-align: right; color: #ffb03a; }
  #hud .tb { flex: 1; height: 6px; background: rgba(255,255,255,.1); border-radius: 999px; overflow: hidden; }
  #hud .tb i { display: block; height: 100%; width: 100%; background: #ffb03a; transform-origin: left; border-radius: 999px; }
  #hud.hot .tb i, #hud.hot .time em { background-color: #ff4a2e; color: #ff6a4e; }
  #hud.hot .tb i { background: #ff4a2e; }
  #tasks { list-style: none; margin: 0; padding: 4px 10px 10px; border-top: 1px solid rgba(255,255,255,.08); }
  #tasks li { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 10px; border-radius: 10px; position: relative; transition: background .2s, opacity .3s; }
  #tasks li + li { border-top: 1px solid rgba(255,255,255,.05); }
  #tasks li:hover { background: rgba(255,255,255,.06); }
  #tasks li.next { background: rgba(255,176,58,.09); }
  #tasks li.next::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: #ffb03a; }
  #tasks .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(255,255,255,.35); font: 700 12px 'IBM Plex Mono', monospace; color: rgba(255,255,255,.8); box-sizing: border-box; }
  #tasks b { display: block; font-size: 16px; font-weight: 700; line-height: 1.3; }
  #tasks small { display: block; font-size: 12.5px; color: rgba(255,255,255,.62); margin-top: 2px; }
  #tasks .bar { height: 4px; background: rgba(255,255,255,.1); border-radius: 999px; margin-top: 8px; overflow: hidden; }
  #tasks .bar span { display: block; height: 100%; width: 0; background: #ffb03a; border-radius: 999px; transition: width .25s; }
  #tasks em { font: 700 15px 'IBM Plex Mono', monospace; font-style: normal; color: #fff; min-width: 40px; text-align: right; }
  #tasks li.done { opacity: .55; }
  #tasks li.done .ic { background: #23c16b; border-color: #23c16b; color: #062a12; font-size: 14px; }
  #tasks li.done b { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.6); }
  #tasks li.done em { color: #3ddc84; font-size: 13px; }
  #tasks li.done .bar { display: none; }
  #tasks li.pop { animation: pop .7s ease; }
  @keyframes pop { 0% { background: rgba(35,193,107,.4); transform: scale(1.02); } 100% { background: transparent; transform: none; } }
  #tip { padding: 13px 20px 15px; background: rgba(255,176,58,.1); border-top: 1px solid rgba(255,176,58,.18); font-size: 13px; font-weight: 500; color: #ffd08a; min-height: 18px; line-height: 1.45; }

  #ed { position: fixed; z-index: 5; display: none; border: 0; outline: 1.5px solid rgba(26,115,232,.8); background: rgba(210,228,255,.95); color: #1d1d22; caret-color: #1a73e8; font-family: 'Noto Serif KR', serif; font-weight: 500; padding: 0 2px; margin: 0; border-radius: 2px; transform-origin: 0 50%; }
  #ed.bad { outline-color: #e0362c; background: rgba(255,220,216,.95); animation: sh .3s; }
  @keyframes sh { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
</style>
</head>
<body>
<div id="top"><a href="../index.html">← INDEX</a></div>
<div id="hud">
  <div class="h"><span>마감 전 해야 할 일</span><b id="hc">0 / 5</b></div>
  <div class="time"><span>남은 시간</span><div class="tb"><i id="tbar"></i></div><em id="tsec">50초</em></div>
  <ol id="tasks"></ol>
  <div id="tip"></div>
</div>
<input id="ed" autocomplete="off" spellcheck="false">
<div id="ov"><button id="go">마감 50초 전 · 시작</button><div class="sub">물티슈, 도장과 인주, 키보드를 써서 다섯 가지를 끝내세요</div></div>
<script type="module" src="main.js?v=12"></script>
</body>
</html>
