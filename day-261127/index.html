<html lang="ko">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;600;900&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Noto Sans KR', sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #top { position: fixed; right: 18px; top: 14px; font: 600 12px 'IBM Plex Mono', monospace; letter-spacing: .14em; z-index: 6; }
  #top a { color: rgba(255,240,220,.75); text-decoration: none; }
  #ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 7; pointer-events: none; }
  #ov button { pointer-events: auto; background: #ff4a2e; color: #fff; border: 0; padding: 16px 40px; font: 900 18px 'Noto Sans KR', sans-serif; letter-spacing: .04em; cursor: pointer; border-radius: 6px; box-shadow: 0 10px 30px rgba(255,60,30,.35), 0 0 0 1px rgba(255,255,255,.15) inset; }
  #ov .sub { color: rgba(255,244,228,.9); font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #ov.hide { display: none; }

  #hud { position: fixed; left: 18px; top: 18px; width: 300px; z-index: 6; color: #f3efe8; background: linear-gradient(180deg, rgba(18,16,15,.86), rgba(12,11,10,.78)); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow: hidden; }
  #hud .h { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 10px; border-bottom: 1px solid rgba(255,255,255,.07); }
  #hud .h span { font: 700 11px 'IBM Plex Mono', 'Noto Sans KR', monospace; letter-spacing: .2em; color: #ff8a5c; }
  #hud .h b { font: 700 13px 'IBM Plex Mono', monospace; color: rgba(255,255,255,.75); }
  #hud .tb { height: 4px; background: rgba(255,255,255,.08); }
  #hud .tb i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff4a2e, #ffb03a); transform-origin: left; }
  #tasks { list-style: none; margin: 0; padding: 6px 8px 8px; }
  #tasks li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 8px; border-radius: 8px; cursor: default; transition: background .2s; }
  #tasks li:hover { background: rgba(255,255,255,.06); }
  #tasks .ic { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.07); font-size: 16px; font-weight: 900; }
  #tasks b { display: block; font-size: 14px; font-weight: 700; }
  #tasks small { display: block; font-size: 11px; color: rgba(255,255,255,.5); margin-top: 1px; }
  #tasks .bar { height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  #tasks .bar span { display: block; height: 100%; width: 0; background: #ffb03a; transition: width .25s; }
  #tasks em { font: 600 12px 'IBM Plex Mono', monospace; font-style: normal; color: rgba(255,255,255,.7); min-width: 34px; text-align: right; }
  #tasks li.done .ic { background: #23c16b; color: #06240f; }
  #tasks li.done b { color: rgba(255,255,255,.45); text-decoration: line-through; text-decoration-color: #23c16b; }
  #tasks li.done em { color: #23c16b; }
  #tasks li.done .bar span { background: #23c16b; }
  #tasks li.pop { animation: pop .6s ease; }
  @keyframes pop { 0% { background: rgba(35,193,107,.35); } 100% { background: transparent; } }
  #tip { padding: 10px 16px 13px; border-top: 1px solid rgba(255,255,255,.07); font-size: 12px; color: #ffcf8a; min-height: 18px; }

  #ed { position: fixed; z-index: 5; display: none; border: 0; outline: 1.5px solid rgba(26,115,232,.8); background: rgba(210,228,255,.95); color: #1d1d22; caret-color: #1a73e8; font-family: 'Noto Serif KR', serif; font-weight: 500; padding: 0 2px; margin: 0; border-radius: 2px; transform-origin: 0 50%; }
  #ed.bad { outline-color: #e0362c; background: rgba(255,220,216,.95); animation: sh .3s; }
  @keyframes sh { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }

  <div class="h"><span>MISSION · 마감까지</span><b id="hc">0 / 5</b></div>

  <ol id="tasks"></ol>
