<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Day 261110 — 충전중</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060b; touch-action: none; user-select: none; -webkit-user-select: none; color: #e4e9ff; font-family: 'IBM Plex Mono', monospace; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #fx { pointer-events: none; z-index: 1; }
  #hud { position: fixed; left: 16px; right: 16px; top: 14px; z-index: 2; display: flex; align-items: flex-start; gap: 16px; pointer-events: none; transition: opacity .4s; }
  #hud .sc b { display: block; font-size: 30px; line-height: 1; letter-spacing: -.01em; }
  #hud .sc span { font-size: 12px; color: #7fe9ff; }
  #hud .mid { flex: 1; max-width: 360px; margin: 6px auto 0; text-align: center; font-size: 11px; color: rgba(228,233,255,.7); }
  #hud .bar { height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
  #hud .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #36d8ff, #b9f4ff); transform-origin: left; }
  #hud .bar.low i { background: #ff5a4f; }
  #hud .cells { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: -2px; }
  #hud .cells em { width: 9px; height: 12px; border: 1px solid rgba(127,233,255,.5); border-radius: 2px; }
  #hud .cells em.on { background: #36d8ff; box-shadow: 0 0 6px #36d8ff; }
  #ov { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; background: rgba(4,5,10,.55); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); transition: opacity .4s; padding: 16px; }
  #ov.hide { opacity: 0; pointer-events: none; }
  #ov .card { text-align: center; max-width: 420px; }
  #ov h1 { margin: 0 0 14px; font-size: 40px; letter-spacing: -.02em; }
  #ov p { margin: 6px 0; font-size: 12px; line-height: 1.7; color: rgba(228,233,255,.75); }
  #ov .big { font-size: 56px; font-weight: 700; color: #fff; margin: 4px 0 8px; }
  #ov button { margin-top: 18px; background: #36d8ff; color: #04121a; border: 0; font: 700 14px 'IBM Plex Mono', monospace; padding: 12px 28px; border-radius: 30px; cursor: pointer; box-shadow: 0 0 24px rgba(54,216,255,.45); }
  .ctl { position: fixed; right: 14px; bottom: 12px; display: flex; gap: 6px; z-index: 4; }
  .ctl button { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: #dfe4ff; font: 500 11px 'IBM Plex Mono', monospace; padding: 7px 10px; border-radius: 20px; cursor: pointer; }
  .back { position: fixed; left: 14px; bottom: 10px; font: 11px sans-serif; color: rgba(220,226,255,.4); text-decoration: none; z-index: 4; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="hud" style="opacity:0">
  <div class="sc"><b id="score">0</b><span id="combo"></span></div>
  <div class="mid"><div class="bar" id="bar"><i id="barI"></i></div><span id="time">45.0</span>초 · 완충 <span id="done">0</span><span class="cells" id="cells"></span></div>
</div>
<div id="ov"><div class="card" id="card"></div></div>
<div class="ctl"><button id="snd">소리 끄기</button><button id="restart">다시 시작</button></div>
<a class="back" href="../index.html">←</a>

<script type="module" src="main.js"></script>
</body>
</html>
