<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 261103 — 버스만 타고 부산까지</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #fff; }
  canvas#road { position: fixed; inset: 0; width: 100%; height: 100%; }
  .back { position: fixed; left: 14px; bottom: 10px; font: 11px sans-serif; color: #bbb; text-decoration: none; }
</style>
</head>
<body>
<canvas id="road"></canvas>

<a class="back" href="../index.html">←</a>

<script>
const PHOTOS = ['01-seoul', '02-suwon', '03-pyeongtaek', '04-cheonan', '05-daejeon', '06-okcheon', '07-gimcheon', '08-daegu', '09-miryang', '10-busan']
  .map(n => `photos/${n}.jpg`);
const cv = document.getElementById('road'), ctx = cv.getContext('2d');
let DPR = 1, seed = 261103, images = [];
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const L2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// 격자 위를 한 붓으로 도는 긴 미로 길 (막힐 곳이 적은 칸을 먼저 고르는 방식 + 약간의 무작위)
function maze(C, R) {
  let best = [];
  const inside = (a, b) => a >= 0 && b >= 0 && a < C && b < R;
  for (let tr = 0; tr < 400 && best.length < C * R * 0.9; tr++) {
    const seen = new Set(['0,0']), path = [[0, 0]];
    let x = 0, y = 0;
    for (;;) {
      const free = (a, b) => DIRS.filter(([dx, dy]) => inside(a + dx, b + dy) && !seen.has(`${a + dx},${b + dy}`)).length;
      const opts = DIRS.map(([dx, dy]) => [x + dx, y + dy]).filter(([a, b]) => inside(a, b) && !seen.has(`${a},${b}`));
      if (!opts.length) break;
      opts.sort((p, q) => free(...p) - free(...q) + (rnd() - 0.5) * 2.4);
      [x, y] = opts[0];
      seen.add(`${x},${y}`); path.push([x, y]);
    }
    if (path.length > best.length) best = path;
  }
  return best;
}

function sideToward(cells, nb) {
  for (const c of cells) {
    const dx = nb.cx - c.cx, dy = nb.cy - c.cy;
    if (Math.abs(dx) + Math.abs(dy) === 1) return dx === 1 ? 'R' : dx === -1 ? 'L' : dy === 1 ? 'D' : 'U';
  }
}
// 기울어진 조각이면 변의 양 끝점도 같은 각도로 돌려서 잔상이 따라 붙게 한다
function edgePts(r, s) {
  const pts = s === 'R' ? [[r.x + r.w, r.y], [r.x + r.w, r.y + r.h]] : s === 'L' ? [[r.x, r.y], [r.x, r.y + r.h]]
            : s === 'D' ? [[r.x, r.y + r.h], [r.x + r.w, r.y + r.h]] : [[r.x, r.y], [r.x + r.w, r.y]];
  if (!r.tilt) return pts;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2, c = Math.cos(r.tilt), sn = Math.sin(r.tilt);
  return pts.map(([x, y]) => [cx + (x - cx) * c - (y - cy) * sn, cy + (x - cx) * sn + (y - cy) * c]);
}

// 조각의 한 변을 "가장자리부터 안쪽으로" 펼친 띠 캔버스 (x = 깊이, y = 변을 따라 p0→p1)
function edgeStrip(pc, side) {
  const pw = pc.width, ph = pc.height, vert = side === 'L' || side === 'R';
  const D = Math.max(2, Math.min(48, (vert ? pw : ph) >> 1)), L = vert ? ph : pw;
  const s = document.createElement('canvas'); s.width = D; s.height = L;
  const c = s.getContext('2d');
  if (side === 'L') c.drawImage(pc, 0, 0, D, ph, 0, 0, D, L);
  if (side === 'R') { c.translate(D, 0); c.scale(-1, 1); c.drawImage(pc, pw - D, 0, D, ph, 0, 0, D, L); }
  if (side === 'U') { c.setTransform(0, 1, 1, 0, 0, 0); c.drawImage(pc, 0, 0, pw, D, 0, 0, pw, D); }
  if (side === 'D') { c.setTransform(0, 1, -1, 0, D, 0); c.drawImage(pc, 0, ph - D, pw, D, 0, 0, pw, D); }
  return s;
}

// 띠의 열 [c0, c1)을 선분 p0→p1 위에, 앞쪽(fwd)으로 두께 th만큼 붙인다
function paintStrip(strip, c0, c1, p0, p1, fwd, th, alpha) {
  const ey = [(p1[0] - p0[0]) / strip.height, (p1[1] - p0[1]) / strip.height], k = th / (c1 - c0);
  ctx.globalAlpha = alpha;
  ctx.setTransform(DPR * fwd[0] * k, DPR * fwd[1] * k, DPR * ey[0], DPR * ey[1], DPR * p0[0], DPR * p0[1]);
  ctx.drawImage(strip, c0, 0, c1 - c0, strip.height, 0, 0, c1 - c0, strip.height);
}

// 원근 통로: 앞 조각의 나가는 변 → 다음 조각의 들어오는 변. 가장자리 픽셀이 늘어나고, 일정 간격으로 작아지며 반복된다
function corridor(A, sa, B, sb, period) {
  let [a0, a1] = edgePts(A, sa), [b0, b1] = edgePts(B, sb), flip = false;
  if (dist(a0, b0) + dist(a1, b1) > dist(a0, b1) + dist(a1, b0)) { [b0, b1] = [b1, b0]; flip = true; }
  const sA = A.strips[sa], sB = B.strips[sb], mA = mid(a0, a1), mB = mid(b0, b1);
  const steps = Math.max(24, Math.ceil(dist(mA, mB) / 1.4));
  const line = t => { const e = smooth(t); return [L2(a0, b0, e), L2(a1, b1, e)]; };
  for (let k = 0; k < steps; k++) {
    const t = k / steps, [p0, p1] = line(t), [q0, q1] = line((k + 1) / steps);
    const dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.hypot(dx, dy) || 1;
    let fwd = [-dy / len, dx / len];
    const go = [mid(q0, q1)[0] - mid(p0, p1)[0], mid(q0, q1)[1] - mid(p0, p1)[1]];
    if (fwd[0] * go[0] + fwd[1] * go[1] < 0) fwd = [-fwd[0], -fwd[1]];
    const th = Math.hypot(...go) + 0.9, e = smooth(t);
    paintStrip(sA, 0, 1, p0, p1, fwd, th, 1);
    paintStrip(sB, 0, 1, flip ? p1 : p0, flip ? p0 : p1, fwd, th, e);
    if (k % period === 0 && t > 0.06 && t < 0.94) {
      const scale = len / ((dist(a0, a1) + dist(b0, b1)) / 2), useB = t > 0.5, s = useB ? sB : sA;
      const band = Math.max(3, 14 * scale);
      paintStrip(s, 0, s.width * 0.6, useB && flip ? p1 : p0, useB && flip ? p0 : p1, fwd, band, 1);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 0.25; ctx.strokeStyle = '#000'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

let panels = [], links = [], trails = [];
function build() {
  if (innerWidth < 200 || innerHeight < 200 || !images.length) return;
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  const W = innerWidth, H = innerHeight, m = 26, cell = Math.round(Math.min((W - 2 * m) / 9, (H - 2 * m) / 6));
  const C = Math.floor((W - 2 * m) / cell), R = Math.floor((H - 2 * m) / cell);
  const ox = (W - C * cell) / 2, oy = (H - R * cell) / 2;
  const cells = maze(C, R).map(([cx, cy]) => ({ cx, cy, x: ox + cx * cell, y: oy + cy * cell }));
  const straight = i => cells[i + 2] && cells[i + 1].cx - cells[i].cx === cells[i + 2].cx - cells[i + 1].cx && cells[i + 1].cy - cells[i].cy === cells[i + 2].cy - cells[i + 1].cy;

  // 길을 조각(P)과 통로(C)로 번갈아 나눈다
  const units = [];
  for (let i = 0, want = 'P'; i < cells.length; want = want === 'P' ? 'C' : 'P') {
    const n = cells[i + 1] && rnd() < (want === 'P' ? 0.22 : 0.3) && straight(i) ? 2 : 1;
    units.push({ type: want, cells: cells.slice(i, i + n) }); i += n;
  }
  if (units[units.length - 1].type === 'C') units[units.length - 1].type = 'P';

  panels = units.filter(u => u.type === 'P');
  let scale = 0.92 + rnd() * 0.08;  // 길을 따라 조각 크기가 커졌다 작아졌다 이어진다 (대부분 크게, 가끔 작게)
  panels.forEach((u, j) => {
    const xs = u.cells.map(c => c.x), ys = u.cells.map(c => c.y);
    const bx = Math.min(...xs), by = Math.min(...ys), bw = Math.max(...xs) + cell - bx, bh = Math.max(...ys) + cell - by;
    const ix = bw * (0.04 + rnd() * 0.14), iy = bh * (0.04 + rnd() * 0.14);
    const w0 = bw - ix * (1.2 + rnd()), h0 = bh - iy * (1.2 + rnd());
    scale = rnd() < 0.2 ? 0.75 + rnd() * 0.1 : Math.max(0.75, Math.min(1, scale + (1 - scale) * 0.6 + (rnd() - 0.5) * 0.08));
    const w = w0 * scale, h = h0 * scale;
    Object.assign(u, { x: bx + ix + (w0 - w) * rnd(), y: by + iy + (h0 - h) * rnd(), w, h });
    const pi = Math.min(PHOTOS.length - 1, Math.floor(j * PHOTOS.length / panels.length)), img = images[pi];
    const same = panels.filter((_, q) => Math.floor(q * PHOTOS.length / panels.length) === pi), k = same.indexOf(u);
    const a = u.w / u.h, nw = img.naturalWidth, nh = img.naturalHeight;
    let ch = nh * (0.38 + rnd() * 0.45), cw = ch * a;
    if (cw > nw) { cw = nw; ch = cw / a; }
    const cx = (nw - cw) * Math.min(1, Math.max(0, (k + 0.5) / same.length + (rnd() - 0.5) * 0.15)), cy = (nh - ch) * rnd();
    u.pc = document.createElement('canvas'); u.pc.width = Math.ceil(u.w * DPR); u.pc.height = Math.ceil(u.h * DPR);
    const pctx = u.pc.getContext('2d');
    pctx.filter = 'saturate(1.25) contrast(1.06)';
    pctx.drawImage(img, cx, cy, cw, ch, 0, 0, u.pc.width, u.pc.height);
    u.strips = {};
    u.tilt = rnd() < 0.4 ? (rnd() < 0.5 ? -1 : 1) * (6 + rnd() * 8) * Math.PI / 180 : 0;
    u.grow = u.tilt ? 1.06 : 1;  // 기울어진 사진은 살짝 키워 이웃과 겹치게
  });

  links = [];
  units.forEach((u, i) => {
    if (u.type !== 'C') return;
    const A = units[i - 1], B = units[i + 1];
    if (!A || !B) return;
    const sa = sideToward(A.cells, u.cells[0]), sb = sideToward(B.cells, u.cells[u.cells.length - 1]);
    A.strips[sa] ||= edgeStrip(A.pc, sa); B.strips[sb] ||= edgeStrip(B.pc, sb);
    links.push({ A, B, sa, sb, period: 5 + (rnd() * 6 | 0) });
  });
  trails = [];
  draw();
}

// 조각 한 장을 중심 (cx, cy)에 기울기·확대 그대로 찍는다. 잔상일 땐 옅은 테두리
function stamp(u, cx, cy, edge) {
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(u.tilt); ctx.scale(u.grow, u.grow);
  ctx.drawImage(u.pc, -u.w / 2, -u.h / 2, u.w, u.h);
  if (edge) { ctx.strokeStyle = 'rgba(0,0,0,0.14)'; ctx.lineWidth = 0.6; ctx.strokeRect(-u.w / 2, -u.h / 2, u.w, u.h); }
  ctx.restore();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const l of links) corridor(l.A, l.sa, l.B, l.sb, l.period);
  for (const t of trails) for (const [x, y] of t.pts) stamp(t.u, x, y, true);
  for (const u of panels) stamp(u, u.x + u.w / 2, u.y + u.h / 2, false);
}

/* ───── 환승음: 카드 찍는 '삑' + "환승입니다" ───── */
let ac;
function transferSound() {
  ac ||= new (window.AudioContext || window.webkitAudioContext)();
  ac.resume();
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = 1980;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.12, t + 0.005);
  g.gain.setValueAtTime(0.12, t + 0.11); g.gain.linearRampToValueAtTime(0, t + 0.13);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.14);
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const say = new SpeechSynthesisUtterance('환승입니다');
  say.lang = 'ko-KR'; say.rate = 1.05; say.pitch = 1.15;
  say.voice = speechSynthesis.getVoices().find(v => v.lang.startsWith('ko')) || null;
  setTimeout(() => speechSynthesis.speak(say), 160);
}

/* ───── 끌기: 지나간 자리에 사진이 계속 찍힌다 ───── */
// 끄는 동안 원래 통로가 새 위치로 따라와 다시 이어지고, 지나간 경로에는 잔상이 남는다
let drag = null, queued = false;
function hit(x, y) {
  for (let i = panels.length - 1; i >= 0; i--) {
    const u = panels[i], cx = u.x + u.w / 2, cy = u.y + u.h / 2, c = Math.cos(-u.tilt), s = Math.sin(-u.tilt);
    const lx = ((x - cx) * c - (y - cy) * s) / u.grow, ly = ((x - cx) * s + (y - cy) * c) / u.grow;
    if (Math.abs(lx) <= u.w / 2 && Math.abs(ly) <= u.h / 2) return u;
  }
}
cv.addEventListener('pointerdown', e => {
  const u = hit(e.clientX, e.clientY);
  if (!u) { seed = 1 + (Math.random() * 2e9 | 0); build(); return; }
  panels.splice(panels.indexOf(u), 1); panels.push(u);
  const c = [u.x + u.w / 2, u.y + u.h / 2];
  drag = { u, dx: e.clientX - c[0], dy: e.clientY - c[1], trail: { u, pts: [c] } };
  trails.push(drag.trail);
  transferSound();
  try { cv.setPointerCapture(e.pointerId); } catch {}
  cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', e => {
  if (!drag) { cv.style.cursor = hit(e.clientX, e.clientY) ? 'grab' : 'default'; return; }
  const { u, trail } = drag, last = trail.pts[trail.pts.length - 1], to = [e.clientX - drag.dx, e.clientY - drag.dy];
  const n = Math.floor(dist(last, to) / 4);
  for (let i = 1; i <= n; i++) {
    const p = L2(last, to, i / n);
    trail.pts.push(p);
  }
  const end = trail.pts[trail.pts.length - 1];
  u.x = end[0] - u.w / 2; u.y = end[1] - u.h / 2;
  if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; draw(); }); }
});
cv.addEventListener('pointerup', () => {
  if (!drag) return;
  draw();
  drag = null;
  cv.style.cursor = 'grab';
});

Promise.all(PHOTOS.map(src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.src = src; })))
  .then(ims => { images = ims; build(); });
addEventListener('resize', build);
</script>
</body>
</html>
