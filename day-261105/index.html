<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 261105 — 백색소음 믹서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #fff; font-family: 'Pretendard Variable', sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .back { position: fixed; left: 14px; bottom: 10px; font: 11px sans-serif; color: #bbb; text-decoration: none; }
  .title { position: fixed; left: 16px; top: 14px; font-size: 12px; font-weight: 600; color: #111; letter-spacing: -.01em; }
  .title span { color: #aaa; font-weight: 400; margin-left: 6px; }
  #hint { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; color: #999; pointer-events: none; transition: opacity .6s; }
  #share { position: fixed; right: 14px; bottom: 10px; font: 11px 'Pretendard Variable', sans-serif; color: #999; background: none; border: 0; cursor: pointer; }
  #share:hover { color: #111; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="title">백색소음 믹서<span>white noise mixer</span></div>
<div id="hint">단어를 누르면 소리가 켜져요 · 위아래로 끌면 볼륨</div>
<button id="share">이 조합 링크 복사</button>
<a class="back" href="../index.html">←</a>

<script>
const SOUNDS = [
  { key: 'rain', word: '비', vol: .55 },
  { key: 'wave', word: '파도', vol: .75 },
  { key: 'fire', word: '장작', vol: .9 },
  { key: 'fan', word: '선풍기', vol: .5 },
  { key: 'cafe', word: '카페', vol: .65 },
];
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
let W = 0, H = 0, DPR = 1, FS = 100, G = 4;
let embers = [], ripples = [];

const fromHash = location.hash.slice(1).split('-').map(Number);
SOUNDS.forEach((s, i) => { s.level = clamp((fromHash[i] || 0) / 100); s.lv = 0; });

// 장작·파도·선풍기의 주기는 소리와 화면이 같은 시계를 쓴다
const swell = t => Math.pow(.5 - .5 * Math.cos(t * Math.PI * 2 / 9), 1.4);
const swing = t => Math.sin(t * Math.PI * 2 / 8);

function build() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  FS = Math.min(H / 6.4, W * .86 / 3.05);
  G = Math.max(2.5, FS / 40);
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const o = off.getContext('2d', { willReadFrequently: true });
  o.font = `900 ${FS}px 'Pretendard Variable', sans-serif`;
  o.textAlign = 'center'; o.textBaseline = 'middle';
  SOUNDS.forEach((s, i) => {
    const y = H / 2 + (i - 2) * FS * 1.16, w = o.measureText(s.word).width;
    s.box = { x: W / 2 - w / 2, y: y - FS * .52, w, h: FS * 1.04, cx: W / 2, cy: y };
    o.clearRect(0, 0, W, H);
    o.fillText(s.word, W / 2, y);
    const x0 = Math.max(0, Math.floor(s.box.x)), y0 = Math.max(0, Math.floor(s.box.y));
    const bw = Math.min(W - x0, Math.ceil(w) + 2), bh = Math.min(H - y0, Math.ceil(s.box.h) + 2);
    const px = o.getImageData(x0, y0, bw, bh).data, pts = [];
    for (let y = 0; y < bh; y += G) for (let x = 0; x < bw; x += G)
      if (px[((y | 0) * bw + (x | 0)) * 4 + 3] > 128) pts.push(x0 + x + (Math.random() - .5) * G * .5, y0 + y + (Math.random() - .5) * G * .5);
    const n = pts.length / 2;
    s.n = n; s.hx = new Float32Array(n); s.hy = new Float32Array(n);
    s.r = new Float32Array(n); s.ph = new Float32Array(n); s.f = new Float32Array(n);
    for (let k = 0; k < n; k++) {
      s.hx[k] = pts[k * 2]; s.hy[k] = pts[k * 2 + 1];
      s.r[k] = Math.random(); s.ph[k] = Math.random() * 6.283; s.f[k] = Math.random();
    }
  });
}

/* ───── 소리 ───── */
let AC = null, NZ = {};
function noiseBuf(type) {
  const n = AC.sampleRate * 6, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
  for (let i = 0; i < n; i++) {
    const w = Math.random() * 2 - 1;
    if (type === 'white') d[i] = w * .5;
    else if (type === 'pink') {
      b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852;
      b3 = .8665 * b3 + w * .3104856; b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362) * .11; b6 = w * .115926;
    } else { last = (last + .02 * w) / 1.02; d[i] = last * 3.5; }
  }
  return b;
}
const gain = v => { const g = AC.createGain(); g.gain.value = v; return g; };
const filt = (type, f, q = .7) => { const b = AC.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
function loop(type) { const s = AC.createBufferSource(); s.buffer = NZ[type]; s.loop = true; s.start(0, Math.random() * 5); return s; }
const chain = (...nodes) => { nodes.reduce((a, b) => (a.connect(b), b)); return nodes[nodes.length - 1]; };

function startAudio() {
  if (AC) { AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  ['white', 'pink', 'brown'].forEach(t => NZ[t] = noiseBuf(t));
  const comp = AC.createDynamicsCompressor(), master = gain(.9);
  chain(master, comp, AC.destination);
  SOUNDS.forEach(s => { s.out = gain(0); s.out.connect(master); s.p = {}; });
  const [rain, wave, fire, fan, cafe] = SOUNDS;

  chain(loop('pink'), filt('highpass', 450), filt('lowpass', 9000), gain(1.1), rain.out);
  chain(loop('white'), filt('bandpass', 6500, .5), gain(.18), rain.out);

  wave.p.lp = filt('lowpass', 400); wave.p.g = gain(.3); wave.p.foam = gain(0);
  chain(loop('brown'), wave.p.lp, wave.p.g, wave.out);
  chain(loop('white'), filt('highpass', 2600), wave.p.foam, wave.out);

  fire.p.roar = gain(.7);
  chain(loop('brown'), filt('lowpass', 320), fire.p.roar, fire.out);

  fan.p.lp = filt('lowpass', 900);
  chain(loop('pink'), fan.p.lp, gain(.9), fan.out);
  chain(loop('brown'), filt('lowpass', 170), gain(.9), fan.out);
  const hum = AC.createOscillator(); hum.frequency.value = 100; hum.start();
  chain(hum, gain(.012), fan.out);

  cafe.p.b1 = gain(.5); cafe.p.b2 = gain(.3);
  chain(loop('pink'), filt('bandpass', 450, .8), cafe.p.b1, cafe.out);
  chain(loop('pink'), filt('bandpass', 1500, 1.3), cafe.p.b2, cafe.out);
}

function burst(out, f, q, dur, amp) {
  const t = AC.currentTime, s = AC.createBufferSource(), g = gain(0);
  s.buffer = NZ.white; s.start(t, Math.random() * 5, dur + .05);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + .0015);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  chain(s, filt('bandpass', f, q), g, out);
}
function clink(out) {
  const t = AC.currentTime, f = 2100 + Math.random() * 1800, g = gain(0);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + .002);
  g.gain.exponentialRampToValueAtTime(.0001, t + .7);
  [1, 2.76].forEach((m, i) => {
    const o = AC.createOscillator(); o.frequency.value = f * m; o.start(t); o.stop(t + .75);
    chain(o, gain(i ? .35 : 1), g);
  });
  g.connect(out);
}

/* ───── 화면 ───── */
let last = performance.now();
const clock = () => AC ? AC.currentTime : performance.now() / 1000;

function events(dt) {
  const [rain, , fire, , cafe] = SOUNDS;
  if (fire.lv > .02 && Math.random() < (1.5 + 9 * fire.lv) * dt) {
    const k = Math.random() * fire.n | 0, n = 2 + Math.random() * 7 * fire.lv | 0;
    for (let i = 0; i < n; i++) embers.push({
      x: fire.hx[k], y: fire.hy[k], vx: (Math.random() - .5) * FS * 2.2, vy: -FS * (1 + Math.random() * 2.4), life: 1,
    });
    if (AC) burst(fire.out, 900 + Math.random() * 3200, .9, .015 + Math.random() * .045, .6 + Math.random() * .8);
  }
  if (AC && rain.lv > .02 && Math.random() < 30 * rain.lv * dt)
    burst(rain.out, 2500 + Math.random() * 5000, 2, .004 + Math.random() * .01, .25);
  if (cafe.lv > .02 && Math.random() < (.15 + .5 * cafe.lv) * dt) {
    const k = Math.random() * cafe.n | 0;
    ripples.push({ x: cafe.hx[k], y: cafe.hy[k], t0: clock() });
    if (AC) clink(cafe.out);
  }
}

function audioParams(t) {
  if (!AC) return;
  const now = AC.currentTime, set = (p, v) => p.setTargetAtTime(v, now, .06);
  const [, wave, fire, fan, cafe] = SOUNDS, sw = swell(t);
  SOUNDS.forEach(s => set(s.out.gain, Math.pow(s.lv, 1.6) * s.vol));
  set(wave.p.lp.frequency, 250 + 1500 * sw); set(wave.p.g.gain, .2 + .95 * sw); set(wave.p.foam.gain, .14 * sw * sw * sw);
  set(fire.p.roar.gain, .55 + .25 * Math.sin(t * 2.3) * Math.sin(t * 5.1));
  set(fan.p.lp.frequency, 650 + 550 * (.5 + .5 * swing(t)));
  set(cafe.p.b1.gain, .4 + .2 * Math.sin(t * .9) + .1 * Math.sin(t * 2.7));
  set(cafe.p.b2.gain, .25 + .15 * Math.sin(t * 1.3 + 1) + .08 * Math.sin(t * 3.4));
}

function draw(s, t, dt) {
  const { n, hx, hy, r, ph, f } = s, lv = s.lv, sz = G * .46;
  const c = Math.round(218 - 201 * clamp(lv * 2.2));
  ctx.fillStyle = `rgb(${c},${c},${c})`;
  const dot = (x, y, a = 1, w = sz, h = sz) => { ctx.globalAlpha = a; ctx.fillRect(x - w / 2, y - h / 2, w, h); };

  if (s.key === 'rain') {
    for (let i = 0; i < n; i++) {
      if (r[i] < lv) {
        f[i] += dt * (.5 + ph[i] * .12) * (.6 + lv);
        if (f[i] > 1) f[i] -= 1;
        const e = f[i] * f[i];
        dot(hx[i], hy[i] + e * FS * 1.5, 1 - f[i] * .9, sz * .8, sz * (1 + e * 9 * lv));
      } else { f[i] = Math.random(); dot(hx[i], hy[i]); }
    }
  } else if (s.key === 'wave') {
    const sw = swell(t), amp = lv * FS * .2 * (.3 + .7 * sw), push = lv * FS * .18 * (sw - .5);
    for (let i = 0; i < n; i++) {
      const p = t * 1.7 - hx[i] / (FS * .8) + hy[i] / (FS * 1.6);
      let x = hx[i] + amp * Math.sin(p) + push, y = hy[i] + amp * .45 * Math.cos(p * 1.2 + ph[i] * .2);
      if (r[i] < sw * sw * sw * lv * .35) { x += Math.cos(ph[i] + t * 3) * G * 4; y -= Math.abs(Math.sin(ph[i] * 3 + t * 2)) * G * 6 * sw; }
      dot(x, y);
    }
  } else if (s.key === 'fire') {
    for (let i = 0; i < n; i++) {
      if (r[i] < lv * .6) {
        f[i] += dt * (.6 + ph[i] * .15);
        if (f[i] > 1) f[i] -= 1;
        const q = f[i];
        dot(hx[i] + Math.sin(t * 7 + ph[i] * 4 + q * 9) * G * 2.2 * q, hy[i] - q * FS * 1.1, 1 - q, sz * (1 - q * .6), sz * (1 - q * .6));
      } else {
        const fl = lv * G * .5;
        dot(hx[i] + Math.sin(t * 13 + ph[i] * 9) * fl, hy[i] + Math.cos(t * 11 + ph[i] * 7) * fl);
      }
    }
  } else if (s.key === 'fan') {
    const sv = swing(t), dir = Math.sign(Math.cos(t * Math.PI * 2 / 8)) || 1, rr = G * 1.7 * lv;
    for (let i = 0; i < n; i++) {
      const a = t * 26 + ph[i];
      let x = hx[i] + sv * FS * .22 * lv + Math.cos(a) * rr, y = hy[i] + Math.sin(a) * rr;
      if (r[i] < lv * .22) {
        f[i] += dt * (.7 + ph[i] * .1);
        if (f[i] > 1) f[i] -= 1;
        dot(x + dir * f[i] * FS * 1.4, y + Math.sin(f[i] * 6 + ph[i]) * G * 2, 1 - f[i], sz * (1 + f[i] * 5), sz * .7);
      } else dot(x, y, .85);
    }
  } else {
    const live = ripples.filter(p => t - p.t0 < 2.2), j = G * 1.1 * lv;
    for (let i = 0; i < n; i++) {
      let x = hx[i] + (Math.sin(t * 2.3 + ph[i] * 7) + Math.sin(t * 3.9 + ph[i] * 3)) * j;
      let y = hy[i] + (Math.cos(t * 2.9 + ph[i] * 5) + Math.sin(t * 4.3 + ph[i] * 2)) * j;
      for (const p of live) {
        const dx = hx[i] - p.x, dy = hy[i] - p.y, d = Math.hypot(dx, dy) || 1, age = t - p.t0;
        const k = Math.exp(-(((d - age * FS * 1.6) / (G * 5)) ** 2)) * Math.exp(-age * 1.6) * FS * .14 * lv;
        x += dx / d * k; y += dy / d * k;
      }
      dot(x, y);
    }
    ripples = live;
  }
  ctx.globalAlpha = 1;
  if (s.level > 0 || s === hover) {
    ctx.fillStyle = '#aaa'; ctx.font = `500 11px 'Pretendard Variable', sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.round(s.level * 100), s.box.x + s.box.w + FS * .14, s.box.cy - FS * .32);
  }
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = clock();
  SOUNDS.forEach(s => s.lv += (s.level - s.lv) * Math.min(1, dt * 4));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  events(dt);
  audioParams(t);
  SOUNDS.forEach(s => draw(s, t, dt));
  ctx.fillStyle = '#111';
  embers = embers.filter(e => (e.life -= dt * 1.4) > 0);
  for (const e of embers) {
    e.vy += FS * 3 * dt; e.x += e.vx * dt; e.y += e.vy * dt;
    ctx.globalAlpha = e.life; ctx.fillRect(e.x - G * .3, e.y - G * .3, G * .6, G * .6);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

/* ───── 조작 ───── */
let drag = null, hover = null;
const pick = (x, y) => SOUNDS.find(s => x > s.box.x - FS * .3 && x < s.box.x + s.box.w + FS * .3 && y > s.box.y && y < s.box.y + s.box.h);
const saveHash = () => history.replaceState(null, '', '#' + SOUNDS.map(s => Math.round(s.level * 100)).join('-'));

cv.addEventListener('pointerdown', e => {
  startAudio(); hint.style.opacity = 0;
  const s = pick(e.clientX, e.clientY);
  if (!s) return;
  drag = { s, y: e.clientY, l: s.level, moved: false };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (drag) {
    const dy = drag.y - e.clientY;
    if (Math.abs(dy) > 4) drag.moved = true;
    if (drag.moved) drag.s.level = clamp(drag.l + dy / (FS * 2));
  } else {
    hover = pick(e.clientX, e.clientY) || null;
    cv.style.cursor = hover ? 'ns-resize' : 'default';
  }
});
cv.addEventListener('pointerup', () => {
  if (!drag) return;
  if (!drag.moved) drag.s.level = drag.s.level > 0 ? 0 : .6;
  drag = null; saveHash();
});
cv.addEventListener('wheel', e => {
  const s = pick(e.clientX, e.clientY);
  if (!s) return;
  e.preventDefault(); startAudio(); hint.style.opacity = 0;
  s.level = clamp(s.level - e.deltaY / 600); saveHash();
}, { passive: false });

document.getElementById('share').onclick = async e => {
  saveHash();
  try { await navigator.clipboard.writeText(location.href); e.target.textContent = '복사했어요'; }
  catch { e.target.textContent = location.hash; }
  setTimeout(() => e.target.textContent = '이 조합 링크 복사', 1600);
};

if (SOUNDS.some(s => s.level > 0)) hint.textContent = '아무 곳이나 누르면 이 조합이 재생돼요';
addEventListener('resize', build);
document.fonts.load(`900 100px 'Pretendard Variable'`).catch(() => {}).then(() => { build(); requestAnimationFrame(frame); });
</script>
</body>
</html>
