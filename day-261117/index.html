<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Day 261117 — 번역불가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161616; color: #ecebe6; font-family: 'IBM Plex Mono', 'Noto Sans KR', monospace; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #top { position: fixed; left: 20px; right: 20px; top: 16px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; z-index: 2; }
  #cap { position: fixed; left: 20px; right: 20px; bottom: 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 28px; align-items: end; z-index: 2; }
  #word { font: 900 46px/1 'Noto Sans KR', sans-serif; letter-spacing: -.02em; }
  #roman { font-size: 12px; opacity: .6; margin-top: 8px; }
  #info { font-size: 12px; line-height: 1.7; max-width: 560px; }
  #en { font-weight: 600; }
  #note { opacity: .6; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; }
  #ex { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 15px; color: #ff6a3d; min-height: 24px; opacity: 0; transition: opacity .5s; }
  #ex.on { opacity: 1; }
  #nav { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  #hint { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; opacity: .55; }
  .btns { display: flex; gap: 6px; align-items: center; }
  .btns button { background: transparent; color: inherit; border: 1px solid rgba(236,235,230,.3); font: 400 12px 'IBM Plex Mono', monospace; padding: 6px 11px; cursor: pointer; }
  .btns button:hover { background: rgba(236,235,230,.1); }
  #idx { font-size: 11px; opacity: .7; margin: 0 6px; }
  .back { color: inherit; opacity: .8; text-decoration: none; }
  @media (max-width: 640px) {
    #cap { grid-template-columns: 1fr auto; }
    #info { grid-column: 1 / -1; grid-row: 2; }
    #word { font-size: 34px; }
    #nav { grid-column: 2; grid-row: 1; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header id="top"><span>번역불가 — untranslatable</span><a class="back" href="../index.html">← index</a></header>
<div id="cap">
  <div><div id="word"></div><div id="roman"></div></div>
  <div id="info"><div id="en"></div><div id="note"></div><div id="ex"></div></div>
  <div id="nav"><div id="hint">빈 곳을 꾹 눌러 보세요</div><div class="btns"><button id="prev" aria-label="이전">←</button><span id="idx"></span><button id="next" aria-label="다음">→</button></div></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
