<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 261102 — 팝업 지옥에 구멍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;900&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --ink: #151515; --muted: #8a8a8a; --line: #e4e4e4; --red: #e0261b; --bg: #fbfaf7; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: 'Pretendard Variable', sans-serif; -webkit-font-smoothing: antialiased; }
  body { cursor: crosshair; user-select: none; }
  button { font: inherit; cursor: pointer; }
  [data-eat], .popup { will-change: transform; }
  .eaten { visibility: hidden; }

  /* ───── 신문 본문 ───── */
  .page { height: 100vh; display: flex; flex-direction: column; padding: 0 3vw; }
  .topad { margin: 10px auto 0; width: min(900px, 100%); height: 54px; border-radius: 4px;
    background: repeating-linear-gradient(45deg, #ffe14d 0 14px, #ffd000 14px 28px);
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
  .topad span { background: var(--ink); color: #ffe14d; padding: 4px 10px; border-radius: 3px; }
  .mast { display: flex; align-items: flex-end; justify-content: space-between;
    padding: 14px 0 10px; border-bottom: 3px double var(--ink); }
  .logo { font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: clamp(26px, 3.2vw, 42px); letter-spacing: -0.04em; }
  .mast .meta { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.6; }
  nav.gnb { display: flex; gap: 2px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  nav.gnb span { padding: 4px 12px; }
  .ticker { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  .ticker b { background: var(--red); color: #fff; padding: 2px 8px; font-size: 11px; letter-spacing: 0.05em; }

  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 2.1fr 1fr; gap: 3vw; padding: 18px 0; }
  .main { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .kicker { font-size: 12px; font-weight: 700; color: var(--red); }
  h1.headline { font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: clamp(26px, 3vw, 44px);
    line-height: 1.25; letter-spacing: -0.035em; position: relative; z-index: 5; }
  .byline { font-size: 12px; color: var(--muted); }
  .photo { height: clamp(120px, 24vh, 260px); border-radius: 2px; position: relative; overflow: hidden;
    background: linear-gradient(#cfd3d6, #a9aeb2); }
  .photo::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
    background: repeating-linear-gradient(90deg, #8d9195 0 2px, #9a9ea2 2px 60px); }
  .photo::after { content: ''; position: absolute; left: 38%; bottom: 14%; width: 26%; height: 22%;
    border-radius: 50%; background: radial-gradient(#000 55%, #2a2a2a 70%, transparent 72%); }
  .photo figcaption { position: absolute; right: 10px; bottom: 6px; font-size: 11px; color: #fff; }
  .main p { font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 15px; line-height: 1.75; color: #333; }
  .inad { border: 1px solid var(--line); padding: 10px 14px; font-size: 13px; display: flex; justify-content: space-between; background: #fff; }
  .inad em { font-style: normal; color: var(--muted); font-size: 11px; }

  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .side h3 { font-size: 13px; font-weight: 800; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .rank { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.45; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .rank i { font-style: normal; font-weight: 800; color: var(--red); width: 14px; }
  .sidead { flex: 1; min-height: 90px; max-height: 220px; border-radius: 4px; color: #fff; padding: 14px;
    background: linear-gradient(135deg, #ff3d7f, #7a3dff); display: flex; flex-direction: column; justify-content: space-between; }
  .sidead b { font-size: 22px; line-height: 1.2; letter-spacing: -0.03em; }
  .sidead small { opacity: 0.8; font-size: 11px; }

  /* ───── 팝업들 ───── */
  .popup { position: fixed; z-index: 20; background: #fff; color: var(--ink); border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.22); font-size: 14px; padding: 16px 18px;
    animation: popin 0.35s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin { from { opacity: 0; transform: scale(0.6); } }
  .popup .x { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 18px; color: #999; line-height: 1; }
  .popup h4 { font-size: 16px; margin-bottom: 6px; letter-spacing: -0.02em; }
  .popup .btns { display: flex; gap: 8px; margin-top: 12px; }
  .popup .btns button { flex: 1; border: 0; border-radius: 6px; padding: 9px 10px; background: var(--ink); color: #fff; font-weight: 700; font-size: 13px; }
  .popup .btns button + button { background: #eee; color: var(--ink); }
  .popup.dark { background: #1b1b1b; color: #fff; }
  .popup.video { padding: 0; overflow: hidden; width: 280px; }
  .popup.video .screen { height: 158px; background: linear-gradient(120deg, #111, #333); display: flex; align-items: flex-end; justify-content: flex-end; padding: 8px; }
  .popup.video .screen span { background: rgba(0,0,0,0.7); color: #fff; font-size: 12px; padding: 5px 10px; border: 1px solid #666; }
  .popup.bar { left: 0 !important; right: 0; border-radius: 0; display: flex; align-items: center; gap: 16px; justify-content: center; }
  .popup.bar .btns { margin: 0; }
  .popup.scam { background: radial-gradient(circle, #fff36b, #ff9d00); text-align: center; font-weight: 800; }
  .popup.scam h4 { font-size: 22px; color: var(--red); }

  /* ───── 블랙홀 렌더링 ───── */
const TAU = Math.PI * 2;
const TILT = 0.26, ROT = -0.32;
const clamp01 = v => Math.max(0, Math.min(1, v));
const pick = arr => arr[Math.random() * arr.length | 0];
const DISK_PAL = [[255,255,255], [170,200,255], [255,212,178], [196,176,255], [120,165,255]];
const TEXT_PAL = [[255,186,104], [255,240,222], [110,220,255], [255,120,200], [176,255,168], [255,228,110]];

const back = document.getElementById('back'), front = document.getElementById('front');
const bctx = back.getContext('2d'), fctx = front.getContext('2d');
let DPR = 1;
function fitCanvas() {
  DPR = Math.min(2, devicePixelRatio || 1);
  for (const c of [back, front]) { c.width = innerWidth * DPR; c.height = innerHeight * DPR; }
}
fitCanvas();

const strands = Array.from({ length: 300 }, () => ({
  rr: 1.35 + Math.pow(Math.random(), 1.7) * 2.4, a: Math.random() * TAU, len: 0.4 + Math.random() * 2.4,
  w: 0.35 + Math.random() * 1.5, al: 0.1 + Math.random() * 0.55, c: pick(DISK_PAL),
}));
const lensed = Array.from({ length: 120 }, () => {
  const under = Math.random() < 0.22;
  return { rr: 1.04 + Math.pow(Math.random(), 2) * (under ? 0.16 : 0.5), a: Math.random() * TAU,
    len: 0.5 + Math.random() * 2, w: 0.3 + Math.random() * 1.1, al: 0.12 + Math.random() * 0.5, c: pick(DISK_PAL), under };
});
const stars = Array.from({ length: 280 }, () => ({ rr: 1.1 + Math.random() * 3.6, a: Math.random() * TAU, s: 0.3 + Math.random() * 1.2, tw: Math.random() * TAU }));
const parts = [];
let flare = 1, shake = 0, clock = 0;
const pageEl = document.querySelector('.page');

// 원반 위 각도 구간 [a0, a0+len] 중 앞(0~π)/뒤(π~2π)에 걸친 조각만 그린다
function arcPieces(a0, len, back) {
  a0 = ((a0 % TAU) + TAU) % TAU;
  const lo = back ? Math.PI : 0, out = [];
  for (const k of [0, TAU]) {
    const s = Math.max(a0, lo + k), e = Math.min(a0 + len, lo + Math.PI + k);
    if (e > s) out.push([s, e]);
  }
  return out;
}
const doppler = t => 0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.cos(t - 0.35), 2);
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function drawStrands(ctx, list, R, sq, isBack, sc) {
  for (const s of list) {
    if (s.under !== undefined && s.under === isBack) continue;
    for (const [a, b] of arcPieces(s.a, s.len, isBack)) {
      ctx.beginPath();
      ctx.ellipse(hole.x, hole.y, s.rr * R, s.rr * R * sq, ROT, a, b);
      ctx.lineWidth = s.w * sc;
      ctx.strokeStyle = rgba(s.c, Math.min(1, s.al * doppler((a + b) / 2) * flare));
      ctx.stroke();
    }
  }
}

function partPos(p, R) {
  const m = p.r0 > 3.4 * R ? clamp01(1 - (p.pr - 3.4 * R) / (p.r0 - 3.4 * R)) : 1;
  const lx = Math.cos(p.pa) * p.pr, ly = Math.sin(p.pa) * p.pr * (1 - (1 - TILT) * m);
  const rot = ROT * m, cr = Math.cos(rot), sr = Math.sin(rot);
  return { x: hole.x + lx * cr - ly * sr, y: hole.y + lx * sr + ly * cr, back: m > 0.5 && Math.sin(p.pa) < 0, ang: p.pa + Math.PI / 2 + rot };
}

function drawParts(ctx, R, isBack) {
  ctx.font = '600 12px "Pretendard Variable", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of parts) {
    const q = partPos(p, R);
    if (q.back !== isBack) continue;
    const a = clamp01(p.life) * clamp01((p.pr - R) / (R * 0.4));
    if (a <= 0.01) continue;
    ctx.save();
    ctx.translate(q.x, q.y); ctx.rotate(q.ang); ctx.scale(p.size / 12, p.size / 12);
    ctx.fillStyle = rgba(p.c, a * 0.35);
    ctx.fillRect(-p.trail, -0.6, p.trail, 1.2);
    ctx.fillStyle = rgba(p.c, a);
    ctx.fillText(p.ch, 0, 0);
    ctx.restore();
  }
}

function render() {
  const R = hole.r;
  for (const ctx of [bctx, fctx]) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight); }
  if (R < 0.5) return;
  const sc = Math.max(0.6, Math.min(1.7, R / 70));

  // 뒤: 우주의 어둠 → 렌즈로 휜 별 → 원반 뒤쪽 결 → 원반 뒤로 넘어간 글자
  const halo = bctx.createRadialGradient(hole.x, hole.y, 0, hole.x, hole.y, R * 4.8);
  halo.addColorStop(0, 'rgba(2,3,8,1)'); halo.addColorStop(0.5, 'rgba(2,3,8,1)');
  halo.addColorStop(0.72, 'rgba(4,6,16,0.82)'); halo.addColorStop(1, 'rgba(4,6,16,0)');
  bctx.fillStyle = halo;
  bctx.fillRect(hole.x - R * 4.8, hole.y - R * 4.8, R * 9.6, R * 9.6);
  bctx.globalCompositeOperation = 'lighter';
  for (const st of stars) {
    const d = st.rr * R, dl = d + (1.15 * R) * (1.15 * R) / d;
    const al = (0.35 + 0.65 * Math.sin(clock * 2 + st.tw) ** 2) * clamp01(1 - dl / (R * 3.8));
    bctx.fillStyle = `rgba(220,230,255,${al})`;
    bctx.fillRect(hole.x + Math.cos(st.a) * dl, hole.y + Math.sin(st.a) * dl, st.s, st.s);
  }
  const glow = bctx.createRadialGradient(hole.x, hole.y, R, hole.x, hole.y, R * 3.2);
  glow.addColorStop(0, `rgba(120,150,255,${0.16 * flare})`); glow.addColorStop(1, 'rgba(120,150,255,0)');
  bctx.fillStyle = glow;
  bctx.fillRect(hole.x - R * 3.2, hole.y - R * 3.2, R * 6.4, R * 6.4);
  drawStrands(bctx, strands, R, TILT, true, sc);
  drawParts(bctx, R, true);
  bctx.globalCompositeOperation = 'source-over';

  // 앞: 그림자 → 원반 앞쪽 결 → 위로 휘어 넘어간 빛 고리 → 광자 고리 → 앞쪽 글자
  fctx.fillStyle = '#000';
  fctx.beginPath(); fctx.arc(hole.x, hole.y, R, 0, TAU); fctx.fill();
  fctx.globalCompositeOperation = 'lighter';
  drawStrands(fctx, strands, R, TILT, false, sc);
  drawStrands(fctx, lensed, R, 1.06, true, sc);
  drawStrands(fctx, lensed, R, 1.06, false, sc);
  fctx.beginPath(); fctx.ellipse(hole.x, hole.y, R * 1.02, R * 1.06, ROT, 0, TAU);
  fctx.lineWidth = 7 * sc; fctx.strokeStyle = `rgba(255,236,220,${0.08 * flare})`; fctx.stroke();
  fctx.lineWidth = 1.1 * sc; fctx.strokeStyle = `rgba(255,246,236,${Math.min(1, 0.85 * flare)})`; fctx.stroke();
  drawParts(fctx, R, false);
  fctx.globalCompositeOperation = 'source-over';
}

/* ───── 빨아들이기 ───── */
function startFall(it, dx, dy, d) {
  it.state = 'fall';
  it.pr = d; it.r0 = Math.max(d, 1);
  it.pa = Math.atan2(-dy, -dx);
  it.spin = 0;
  it.text = (it.el.innerText || '').replace(/\s+/g, '') || '▮▯▪▫◼◻';
  it.ti = 0;
  it.el.style.animation = 'none';
  it.el.style.zIndex = 40;
  if (!it.popup) it.el.style.position = 'relative';
}

function emit(it, n, shrink) {
  for (let i = 0; i < n && parts.length < 1600; i++) {
    const ch = it.text[it.ti++ % it.text.length];
    const ox = (Math.random() - 0.5) * it.w * shrink, oy = (Math.random() - 0.5) * it.h * shrink;
    const x = Math.cos(it.pa) * it.pr + ox, y = Math.sin(it.pa) * it.pr + oy;
    const pr = Math.hypot(x, y);
    parts.push({ ch, pr, r0: pr, pa: Math.atan2(y, x), c: pick(TEXT_PAL), size: 8 + Math.random() * 7,
      trail: 8 + Math.random() * 26, life: 1, decay: 0.003 + Math.random() * 0.01,
      band: Math.random() < 0.4 ? hole.r * (1.5 + Math.random() * 1.8) : 0 });
  }
}

function eat(it) {
  it.state = 'eaten';
  it.el.classList.add('eaten');
  const area = Math.min(it.w * it.h, 80000);
  hole.mass += area;
  flare = Math.min(2.2, flare + 0.25 + area / 60000);
  shake = Math.min(10, shake + area / 9000);
  gulp(Math.sqrt(it.w * it.h));
}

function stepParts(R) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.pa += 0.05 * Math.pow((R * 1.4) / Math.max(p.pr, R * 1.1), 1.5);
    if (p.band && p.pr < p.band) { p.pr *= 0.9985; p.life -= p.decay; }
    else p.pr = p.pr * 0.965 - 0.8;
    if (p.pr < R * 0.95 || p.life <= 0) parts.splice(i, 1);
  }
}

function step() {
  clock += 1 / 60;
  hole.x += (hole.tx - hole.x) * 0.07;
  hole.y += (hole.ty - hole.y) * 0.07;

  let targetR = 0;
  if (phase === 'eating') targetR = Math.min(120, 20 + Math.sqrt(hole.mass) * 0.12);
  if (phase === 'spit') targetR = 60;
  hole.r += (targetR - hole.r) * (phase === 'collapse' ? 0.04 : 0.08);
  flare += (1 - flare) * 0.05;
  shake *= 0.88;
  pageEl.style.transform = shake > 0.3 ? `translate(${(Math.random() - 0.5) * shake}px, ${(Math.random() - 0.5) * shake}px)` : '';

  for (const s of strands) s.a += 0.022 * Math.pow(1.35 / s.rr, 1.5);
  for (const s of lensed) s.a += 0.03 * Math.pow(1.04 / s.rr, 1.5);
  if (rumbleGain) rumbleGain.gain.setTargetAtTime(Math.min(0.14, hole.r / 900), ac.currentTime, 0.1);

  if (phase === 'eating') {
    let left = 0;
    for (const it of items) {
      if (it.state === 'eaten') continue;
      left++;
      const dx = hole.x - it.cx, dy = hole.y - it.cy;
      const d = Math.hypot(dx, dy) || 1;
      const size = Math.sqrt(it.w * it.h);

      if (it.state === 'idle') {
        const reach = hole.r * (it.popup ? 6 : 3.8) + size * 0.5;
        const pull = clamp01(1 - d / reach);
        const capture = hole.r * (it.popup ? 2.4 : 1.4) + size * (it.popup ? 0.5 : 0.3);
        if (d < capture) { startFall(it, dx, dy, d); continue; }
        const k = pull * pull * 22;
        it.el.style.transform = pull > 0
          ? `translate(${dx / d * k}px, ${dy / d * k}px) rotate(${(Math.random() - 0.5) * pull * 3}deg)`
          : '';
        continue;
      }

      it.pr = it.pr * 0.955 - 1.2;
      it.pa += Math.min(0.35, 2.2 / Math.max(it.pr, 8));
      it.spin += 0.08;
      const s = clamp01(it.pr / it.r0);
      const shrink = Math.pow(s, 0.8);
      const stretch = 1 + (1 - s) * 2.2;
      const px = hole.x + Math.cos(it.pa) * it.pr - it.cx;
      const py = hole.y + Math.sin(it.pa) * it.pr - it.cy;
      it.el.style.transform =
        `translate(${px}px, ${py}px) rotate(${it.pa}rad) scale(${shrink * stretch}, ${shrink / stretch}) rotate(${-it.pa + it.spin}rad)`;
      it.el.style.opacity = Math.min(1, s * 3);
      emit(it, 2 + Math.min(6, it.w * it.h / 8000) | 0, shrink);
      if (it.pr < 2 || shrink < 0.03) eat(it);
    }
    if (left === 0 && spawned >= MAX_POPUPS) phase = 'collapse';
    if (left === 0 && spawned < MAX_POPUPS && spawned >= POPUPS.length) {
      spawned = MAX_POPUPS;
      clearInterval(spawnTimer);
    }
  }
  stepParts(Math.max(hole.r, 1));

  if (phase === 'collapse' && hole.r < 1 && parts.length === 0) {
    phase = 'done';
    hintEl.textContent = '다시 클릭하면 뱉어내요';
    hintEl.style.opacity = 1;
  }

  render();
  requestAnimationFrame(step);
}

function spitBack() {
  phase = 'spit';
  sweep(70, 1100, 0.9, 0.14);
  const eaten = items.filter(it => it.state === 'eaten');
  items = items.filter(it => !it.popup);
  eaten.forEach((it, i) => {
    if (it.popup) { it.el.remove(); return; }
    const el = it.el;
    el.style.transition = 'none';
    el.style.opacity = 1;
    el.style.transform = `translate(${hole.x - it.cx}px, ${hole.y - it.cy}px) scale(0.05) rotate(${Math.random() * 720 - 360}deg)`;
    el.classList.remove('eaten');
    void el.offsetWidth;
    el.style.transition = `transform 0.9s cubic-bezier(.2,1.5,.4,1) ${i * 35}ms`;
    el.style.transform = '';
  });
  const total = 900 + eaten.length * 35;
  setTimeout(() => {
    items.forEach(it => {
      it.state = 'idle';
      it.el.style.transition = it.el.style.zIndex = it.el.style.position = '';
      measure(it);
    });
    hole.mass = 0;
    parts.length = 0;
    hole.active = false;
    spawned = 0;
    phase = 'idle';
    hintEl.textContent = HINT_START;
    startSpawning();
  }, total);
}

addEventListener('pointermove', e => { hole.tx = e.clientX; hole.ty = e.clientY; });
addEventListener('pointerdown', e => {
  initAudio();
  hole.tx = e.clientX; hole.ty = e.clientY;
  if (phase === 'idle') {
    hole.x = e.clientX; hole.y = e.clientY;
    hole.active = true;
    phase = 'eating';
    hintEl.style.opacity = 0;
  } else if (phase === 'done') {
    hole.x = e.clientX; hole.y = e.clientY;
    hintEl.style.opacity = 0;
    spitBack();
  }
});
addEventListener('resize', () => { fitCanvas(); items.forEach(it => { if (it.state === 'idle') measure(it); }); });

startSpawning();
requestAnimationFrame(step);
</script>
</body>
</html>
